<!DOCTYPE html>
<html lang="es" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gasteiz Lines</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    :root{
      --bg:#0b1020;
      --surface:rgba(255,255,255,.08);
      --surface-2:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.68);
      --glass-border:rgba(255,255,255,.14);
      --shadow:0 18px 48px rgba(0,0,0,.35);
      --ring:0 0 0 3px rgba(124,92,255,.35);
      --primary:#7c5cff;
      --danger:#ff4d6d;
      --ok:#22c55e;
      --warn:#f59e0b;
      --radius:18px;
      --radius-lg:22px;
      --max:1100px;
      --card-pad:14px;
      --blur:16px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      --ease: cubic-bezier(.22,1,.36,1);
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f6f7fb;
        --surface:rgba(255,255,255,.74);
        --surface-2:rgba(255,255,255,.86);
        --text:rgba(13,18,40,.92);
        --muted:rgba(13,18,40,.60);
        --glass-border:rgba(13,18,40,.12);
        --shadow:0 18px 48px rgba(16,24,40,.10);
        --ring:0 0 0 3px rgba(124,92,255,.24);
      }
    }

    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(1200px 650px at 15% 5%, rgba(124,92,255,.22), transparent 60%),
        radial-gradient(900px 500px at 85% 0%, rgba(34,197,94,.18), transparent 60%),
        radial-gradient(900px 500px at 50% 95%, rgba(245,158,11,.16), transparent 60%),
        var(--bg);
      color:var(--text);
      overflow-x:hidden;
    }

    /* Layout */
    .app{
      max-width: var(--max);
      margin:0 auto;
      padding: 18px 14px 92px;
      box-sizing:border-box;
    }

    header{
      position: sticky;
      top:0;
      z-index: 50;
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      background: linear-gradient(to bottom, rgba(0,0,0,.38), rgba(0,0,0,.10));
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    [data-theme="light"] header{
      background: linear-gradient(to bottom, rgba(255,255,255,.74), rgba(255,255,255,.42));
      border-bottom: 1px solid rgba(13,18,40,.08);
    }
    .topbar{
      max-width: var(--max);
      margin: 0 auto;
      padding: 14px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      box-sizing:border-box;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .logo{
      width:38px;height:38px;border-radius:14px;
      display:grid;place-items:center;
      background: linear-gradient(135deg, rgba(124,92,255,.85), rgba(245,158,11,.80));
      box-shadow: 0 14px 28px rgba(124,92,255,.20);
      flex:0 0 auto;
    }
    .logo i{font-size:22px}
    .title{
      display:flex;
      flex-direction:column;
      min-width:0;
    }
    .title strong{
      font-size:14px;
      letter-spacing:.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .title span{
      font-size:12px;color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .actions{
      display:flex;align-items:center;gap:10px;
    }

    .btn{
      border:none;
      outline:none;
      padding:10px 12px;
      border-radius:14px;
      cursor:pointer;
      color:var(--text);
      background: var(--surface);
      border:1px solid var(--glass-border);
      box-shadow: 0 10px 26px rgba(0,0,0,.16);
      display:inline-flex;align-items:center;gap:8px;
      transition: transform .08s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
      user-select:none;
    }
    .btn:active{ transform: translateY(1px) scale(.99); }
    .btn:focus-visible{ box-shadow: var(--ring), 0 10px 26px rgba(0,0,0,.16); }
    .btn .material-icons{ font-size:20px; line-height:0; opacity:.92}
    .btn.primary{
      background: linear-gradient(135deg, rgba(124,92,255,.92), rgba(124,92,255,.62));
      border: 1px solid rgba(124,92,255,.35);
    }
    .btn.danger{
      background: linear-gradient(135deg, rgba(255,77,109,.92), rgba(255,77,109,.62));
      border: 1px solid rgba(255,77,109,.35);
    }

    .hint{
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    .hint .dot{
      width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.35);
    }

    /* Panels grid */
    .grid{
      margin-top: 18px;
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 980px){
      .grid{ gap:12px; }
    }
    @media (max-width: 680px){
      .app{ padding-bottom: 112px; }
      .grid{ grid-template-columns: 1fr; }
    }

    .card{
      grid-column: span 4;
      background: var(--surface);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      transition: transform .14s var(--ease), box-shadow .2s var(--ease);
    }
    @media (hover:hover){
      .card:hover{ transform: translateY(-2px); box-shadow: 0 26px 64px rgba(0,0,0,.32); }
      [data-theme="light"] .card:hover{ box-shadow: 0 26px 64px rgba(16,24,40,.16); }
    }
    @media (max-width: 980px){
      .card{ grid-column: span 6; }
    }
    @media (max-width: 680px){
      .card{ grid-column: span 12; }
    }

    .card::before{
      content:"";
      position:absolute;inset:0;
      background:
        radial-gradient(420px 180px at 30% -10%, rgba(255,255,255,.10), transparent 60%),
        radial-gradient(320px 160px at 80% 0%, rgba(124,92,255,.12), transparent 60%);
      pointer-events:none;
      opacity:.9;
    }

    .card-inner{ position:relative; padding: var(--card-pad); display:flex; flex-direction:column; gap:10px; }

    .card-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }
    .line-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 7px 10px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.10);
      font-size: 12px;
      font-weight: 700;
      letter-spacing:.2px;
      user-select:none;
    }
    [data-theme="light"] .line-pill{ background: rgba(255,255,255,.30); border:1px solid rgba(13,18,40,.08); }
    .line-pill i{ font-size:18px; opacity:.9 }
    .line-code{
      font-family: var(--mono);
      font-weight: 900;
      letter-spacing: .6px;
    }

    .card-tools{
      display:flex; gap:8px; align-items:center;
    }
    .iconbtn{
      width:36px;height:36px;border-radius:14px;
      display:grid;place-items:center;
      border:1px solid var(--glass-border);
      background: rgba(0,0,0,.08);
      cursor:pointer;
      transition: transform .08s var(--ease), background .2s var(--ease);
      user-select:none;
    }
    [data-theme="light"] .iconbtn{ background: rgba(255,255,255,.38); }
    .iconbtn:active{ transform: translateY(1px) scale(.99); }
    .iconbtn i{ font-size:20px; opacity:.85 }
    .iconbtn:hover{ background: rgba(255,255,255,.14); }
    [data-theme="light"] .iconbtn:hover{ background: rgba(255,255,255,.64); }

    .row{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:12px;
    }

    .stop-name{
      font-weight: 800;
      letter-spacing:-.2px;
      line-height: 1.2;
      font-size: 14px;
      min-width:0;
    }
    .stop-name span{
      display:inline-block;
      max-width: 100%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      vertical-align:bottom;
    }

    .next-time{
      font-size: 22px;
      font-weight: 950;
      letter-spacing:-.5px;
      line-height:1.1;
      display:flex;
      align-items:baseline;
      gap:8px;
      flex-wrap:wrap;
    }
    .next-time small{
      font-size:12px;
      font-weight:800;
      color:var(--muted);
      letter-spacing:.2px;
    }

    .delay{
      font-size:12px;
      font-weight:900;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.14);
      user-select:none;
    }
    [data-theme="light"] .delay{ background: rgba(255,255,255,.50); border:1px solid rgba(13,18,40,.10); }
    .delay-ok{ color: rgba(34,197,94,.96); }
    .delay-bad{ color: rgba(255,77,109,.98); }
    .delay-neutral{ color: var(--muted); }
    .delay-warn{ color: rgba(245,158,11,.98); }

    .pill{
      font-size:12px;
      font-weight:800;
      padding:4px 9px;
      border-radius:999px;
      background: rgba(124,92,255,.16);
      border:1px solid rgba(124,92,255,.26);
      color: rgba(124,92,255,.98);
      user-select:none;
    }

    .arrivals{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top: 2px;
    }
    .chip{
      padding: 7px 9px;
      border-radius: 14px;
      border:1px solid var(--glass-border);
      background: rgba(0,0,0,.10);
      display:flex;
      align-items:center;
      gap:8px;
      user-select:none;
    }
    [data-theme="light"] .chip{ background: rgba(255,255,255,.34); }
    .chip .when{
      font-weight: 950;
      font-size:12px;
      letter-spacing:.2px;
    }
    .chip .clock{
      font-size:12px;
      color: var(--muted);
      font-weight: 800;
    }

    .notice{
      margin-top: 10px;
      padding: 10px 11px;
      border-radius: 16px;
      border:1px solid rgba(245,158,11,.32);
      background: rgba(245,158,11,.12);
      color: rgba(245,158,11,.96);
      font-size: 12px;
      display:none;
      line-height:1.3;
    }
    .notice.show{ display:block; }

    /* Bottom nav */
    nav.bottom{
      position: fixed;
      left:0;right:0;bottom:0;
      z-index:60;
      padding: 10px 12px;
      background: linear-gradient(to top, rgba(0,0,0,.48), rgba(0,0,0,.0));
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
    }
    [data-theme="light"] nav.bottom{
      background: linear-gradient(to top, rgba(255,255,255,.84), rgba(255,255,255,.0));
    }
    .navinner{
      max-width: var(--max);
      margin:0 auto;
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding: 10px 10px;
      border-radius: 22px;
      background: var(--surface);
      border:1px solid var(--glass-border);
      box-shadow: var(--shadow);
    }
    .navbtn{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      padding: 10px 8px;
      border-radius: 18px;
      border:1px solid transparent;
      cursor:pointer;
      user-select:none;
      transition: background .2s var(--ease), transform .08s var(--ease);
    }
    .navbtn:active{ transform: translateY(1px) scale(.99); }
    .navbtn i{ font-size:22px; opacity:.92 }
    .navbtn span{ font-size:11px; font-weight:850; color: var(--muted); }
    .navbtn.active{
      background: rgba(124,92,255,.16);
      border:1px solid rgba(124,92,255,.26);
    }
    .navbtn.active span{ color: rgba(124,92,255,.96); }

    /* Modals */
    .modal{
      position: fixed;
      inset:0;
      z-index: 90;
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding: 16px;
      box-sizing:border-box;
      background: rgba(0,0,0,.44);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    [data-theme="light"] .modal{ background: rgba(16,24,40,.24); }
    .modal.open{ display:flex; }
    .sheet{
      width: min(720px, 96vw);
      max-height: min(86vh, 840px);
      overflow:auto;
      border-radius: 26px;
      background: var(--surface-2);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow);
      padding: 14px;
      box-sizing:border-box;
      animation: pop .18s var(--ease);
    }
    @keyframes pop{ from{ transform: translateY(18px) scale(.98); opacity:0 } to{ transform: translateY(0) scale(1); opacity:1 } }

    .search{
      width:100%;
      box-sizing:border-box;
      border-radius: 16px;
      padding: 12px 12px;
      font-size: 14px;
      outline:none;
      border:1px solid var(--glass-border);
      background: rgba(0,0,0,.10);
      color: var(--text);
      margin-top: 12px;
    }
    [data-theme="light"] .search{ background: rgba(255,255,255,.64); }

    .tabs{
      margin-top: 12px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .chipbtn{
      padding: 8px 10px;
      border-radius: 999px;
      border:1px solid var(--glass-border);
      background: rgba(0,0,0,.10);
      font-size: 12px;
      font-weight: 900;
      cursor:pointer;
      user-select:none;
      transition: background .2s var(--ease), transform .08s var(--ease);
    }
    [data-theme="light"] .chipbtn{ background: rgba(255,255,255,.42); }
    .chipbtn:active{ transform: translateY(1px) scale(.99); }
    .chipbtn.active{
      background: rgba(124,92,255,.20);
      border:1px solid rgba(124,92,255,.30);
      color: rgba(124,92,255,.98);
    }

    .list{
      margin-top: 12px;
      display:grid;
      gap:10px;
    }
    .item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 12px 12px;
      border-radius: 18px;
      border:1px solid var(--glass-border);
      background: rgba(0,0,0,.08);
      cursor:pointer;
      user-select:none;
      transition: background .2s var(--ease), transform .08s var(--ease);
    }
    [data-theme="light"] .item{ background: rgba(255,255,255,.42); }
    .item:active{ transform: translateY(1px) scale(.995); }
    .item:hover{ background: rgba(255,255,255,.12); }
    [data-theme="light"] .item:hover{ background: rgba(255,255,255,.70); }
    .item strong{ font-weight: 950; font-size: 14px; letter-spacing:-.2px; }
    .item small{ color: var(--muted); font-weight: 800; }

    .empty{
      padding: 14px;
      color: var(--muted);
      font-size: 13px;
      text-align:center;
    }

    .offline{
      display:none;
      margin: 14px 0 0;
      padding: 11px 12px;
      border-radius: 18px;
      border:1px solid rgba(255,77,109,.32);
      background: rgba(255,77,109,.10);
      color: rgba(255,77,109,.95);
      font-size: 12px;
      font-weight: 850;
      line-height: 1.3;
    }

    .spin{ animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Tram blocks */
    .dest-block{
      margin-top: 8px;
      padding: 10px 10px;
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      background: rgba(0,0,0,.08);
    }
    [data-theme="light"] .dest-block{ background: rgba(255,255,255,.42); }
    .dest-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom: 8px;
    }
    .dest-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size: 12px;
      font-weight: 900;
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid var(--glass-border);
      background: rgba(0,0,0,.12);
      user-select:none;
    }
    [data-theme="light"] .dest-pill{ background: rgba(255,255,255,.54); }
    .dest-pill i{ font-size:18px; opacity:.9 }
    .dest-label{ color: var(--muted); font-weight: 900; }
    .dest-value{
      font-weight: 950;
      letter-spacing:-.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 240px;
      display:inline-block;
      vertical-align:bottom;
    }

    .tram-sec{
      font-weight: 1000;
      font-size: 26px;
      letter-spacing:-.8px;
      font-variant-numeric: tabular-nums;
    }

    .viewport-shim{
      height: env(safe-area-inset-bottom);
    }

    /* === Click en contador (trigger) === */
    .timeline-trigger{
      cursor:pointer;
      border-radius:14px;
      padding:6px 10px;
      margin:-6px -10px;
      transition:transform .06s, box-shadow .2s, background .2s;
      background:transparent;
    }
    .timeline-trigger:active{ transform:scale(.99); }
    .timeline-trigger:focus-visible{ outline:none; box-shadow:var(--ring); }
    @media (hover:hover) and (pointer:fine){
      .timeline-trigger:hover{
        background:color-mix(in oklab,var(--surface-2) 70%, transparent);
        box-shadow:0 10px 26px rgba(16,24,40,.10);
      }
    }

    /* === Modal Timeline === */
    #timelineModal .sheet{
      width:min(820px,96vw);
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .timeline-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .timeline-sub{
      color:var(--muted);
      font-size:12px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .timeline-list{
      border:1px solid var(--glass-border);
      background:var(--surface-2);
      border-radius:16px;
      overflow:hidden;
    }
    .tl-item{
      display:grid;
      grid-template-columns: 22px 1fr auto;
      gap:12px;
      padding:12px 14px;
      border-bottom:1px solid var(--glass-border);
      align-items:flex-start;
    }
    .tl-item:last-child{ border-bottom:none; }
    .tl-rail{
      position:relative;
      display:flex;
      justify-content:center;
      padding-top:2px;
    }
    .tl-dot{
      width:12px;height:12px;border-radius:50%;
      background: color-mix(in oklab, var(--line-accent) 78%, var(--text));
      box-shadow:0 8px 16px rgba(16,24,40,.12);
      border:2px solid color-mix(in oklab, var(--surface) 80%, transparent);
    }
    .tl-line{
      position:absolute;
      top:16px; bottom:-12px;
      width:2px;
      background: color-mix(in oklab, var(--line-accent) 35%, var(--glass-border));
      border-radius:99px;
    }
    .tl-main{ min-width:0; }
    .tl-stop{
      font-weight:950;
      letter-spacing:-.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .tl-meta{
      margin-top:3px;
      color:var(--muted);
      font-size:12px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .tl-right{
      text-align:right;
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
    }
    .tl-eta{
      font-weight:950;
      font-size:14px;
    }
    .tl-clock{
      margin-top:4px;
      color:var(--muted);
      font-size:12px;
      font-weight:850;
    }
    .tl-current .tl-dot{
      background: color-mix(in oklab, var(--primary) 70%, var(--line-accent));
    }
    .tl-badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid var(--glass-border);
      background:color-mix(in oklab,var(--surface) 80%, transparent);
      color:var(--muted);
      font-size:12px;
      font-weight:950;
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"><i class="material-icons">directions_transit</i></div>
        <div class="title">
          <strong>Gasteiz Lines</strong>
          <span id="subtitle">Llegadas en tiempo real • Dashboard</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="themeToggle" title="Cambiar tema">
          <i class="material-icons">brightness_6</i>
          <span style="font-weight:900;font-size:12px">Tema</span>
        </button>
        <button class="btn primary" id="navAdd" title="Añadir línea">
          <i class="material-icons">add</i>
          <span style="font-weight:900;font-size:12px">Añadir</span>
        </button>
      </div>
    </div>
  </header>

  <div class="app">
    <div id="offlineBanner" class="offline">
      ⚠️ Estás sin conexión. Se mostrarán los últimos datos disponibles.
    </div>

    <div class="grid" id="panels-container"></div>

    <div class="empty" id="emptyState" style="display:none">
      No tienes líneas añadidas. Pulsa <strong>Añadir</strong> para empezar.
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom" aria-label="Acciones principales">

      <div class="navbtn active" id="navDashboard">

        <span>Dashboard</span>

        <span>Actualizar</span>
      </div>
      <div class="navbtn" id="navSettings">
        <i class="material-icons">tune</i>
        <span>Opciones</span>
      </div>

  </nav>

  <!-- Modal add -->
  <div id="addModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h3 id="addModalTitle" style="margin:0">Añadir línea</h3>
        <button class="btn" id="closeAdd"><i class="material-icons">close</i></button>
      </div>

      <input id="addSearchInput" class="search" type="search" placeholder="Buscar línea…" inputmode="search"
             enterkeyhint="search" autocapitalize="none" autocomplete="off" spellcheck="false" />

      <div class="tabs">
        <button class="chipbtn active" id="chipAll">Todas</button>
        <button class="chipbtn" id="chipBus">Bus</button>
        <button class="chipbtn" id="chipTram">Tranvía</button>
      </div>

      <div id="addList" role="listbox"></div>
    </div>
  </div>

  <!-- Modal paradas -->
  <div id="stopsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="stopsModalTitle">
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h3 id="stopsModalTitle" style="margin:0">Selecciona una parada</h3>
        <div style="display:flex;gap:8px">
          <button class="btn" id="nearbyStopsBtn" title="Ordenar por cercanía"><i class="material-icons">my_location</i></button>
          <button class="btn" id="closeStops"><i class="material-icons">close</i></button>
        </div>
      </div>

      <input id="stopSearchInput" class="search" type="search"
             placeholder="Buscar parada…" inputmode="search" enterkeyhint="search"
             autocapitalize="none" autocomplete="off" spellcheck="false" />

      <div id="stopsListContainer" role="listbox"></div>
    </div>
  </div>

  <!-- Modal timeline (llegadas por siguientes paradas) -->
  <div id="timelineModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="timelineModalTitle">
    <div class="sheet">
      <div class="timeline-head">
        <div style="min-width:0">
          <h3 id="timelineModalTitle" style="margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
            Siguientes paradas
          </h3>
          <div id="timelineModalSub" class="timeline-sub"></div>
        </div>
        <button class="btn" id="closeTimeline" aria-label="Cerrar">
          <i class="material-icons">close</i>
        </button>
      </div>

      <div id="timelineList" class="timeline-list" aria-live="polite"></div>
    </div>
  </div>

  <script>
  /* ========= State ========= */
  let currentStopsForInstance = null;
  let addFilter = "all";
  const panels = {};
  let autoRefreshTimer = null;
  let globalLastRefresh = 0;
  let globalTickTimer = null;

  const colorCache = loadJSON("line_colors", {});
  const inflightColor = new Set();

  const ARRIVALS_TPL = "https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_PARADAS&idParada={stopId}&idRuta={lineCode}";

  const lines = [
    { code:"E1",  name:"Cementerio El Salvador", type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=E1" },
    { code:"E2",  name:"Circular",               type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=E2" },
    { code:"E3",  name:"Betoño",                 type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=E3" },
    { code:"E4",  name:"Lakua - Abetxuko",        type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=E4" },
    { code:"E5",  name:"Salburua",               type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=E5" },
    { code:"E6",  name:"Arana",                   type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=E6" },
    { code:"E7",  name:"Zabalgana",              type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=E7" },
    { code:"E8",  name:"Universidades",          type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=E8" },
    { code:"E9",  name:"Mariturri",              type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=E9" },
    { code:"E10", name:"Aretxabaleta",           type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=E10" },

    { code:"L1",  name:"Circular",               type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=1" },
    { code:"L2A", name:"Circular A",             type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=L2A" },
    { code:"L2B", name:"Circular B",             type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=L2B" },
    { code:"L3",  name:"Aranbizkarra",           type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=3" },
    { code:"L4",  name:"Lakua",                  type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=4" },
    { code:"L5",  name:"Salburua",               type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=5" },
    { code:"L6",  name:"Zabalgana",              type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=6" },
    { code:"L7",  name:"Borina",                 type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=7" },

    { code:"T",   name:"Tranvía",                type:"tram", stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RECORRIDO&idRuta=T" }
  ];

  /* ========= Helpers ========= */
  const $  = (sel, root=document)=> root.querySelector(sel);
  const $$ = (sel, root=document)=> Array.from(root.querySelectorAll(sel));

  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll("\"","&quot;")
      .replaceAll("'","&#039;");
  }
  function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }

  function loadJSON(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if(!raw) return fallback;
      return JSON.parse(raw);
    }catch(e){ return fallback; }
  }
  function saveJSON(key, value){
    localStorage.setItem(key, JSON.stringify(value));
  }

  function pref(){
    const v = localStorage.getItem("theme");
    return v || "auto";
  }
  function applyTheme(mode){
    document.documentElement.dataset.theme = mode==="auto" ? (matchMedia('(prefers-color-scheme: light)').matches ? "light":"dark") : mode;
    localStorage.setItem("theme", mode);
    $("#subtitle").textContent = `Llegadas en tiempo real • Tema: ${mode}`;
  }
  function cycleTheme(){
    const curr = localStorage.getItem("theme") || "auto";
    const next = curr==="auto" ? "dark" : (curr==="dark" ? "light" : "auto");
    applyTheme(next);
  }

  function toProxiedUrl(url){
    // Pages Function proxy: /api?u=<encoded>
    return `/api?u=${encodeURIComponent(url)}`;
  }

  async function getText(url){
    const res = await fetch(toProxiedUrl(url), { cache:"no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    return await res.text();
  }
  async function getJSON(url){
    const txt = await getText(url);
    const j = tryParseJSON(txt);
    return j;
  }
  function tryParseJSON(txt){
    try{ return JSON.parse(txt); }catch(_){
      // Some endpoints return JS object-ish; try to salvage
      return null;
    }
  }

  function lockBodyScroll(){
    document.body.style.overflow = "hidden";
  }
  function unlockBodyScroll(){
    document.body.style.overflow = "";
  }
  function attachViewportShim(modal){
    // iOS safe-area bottom support for sheet + nav overlap
    if(!modal.querySelector(".viewport-shim")){
      const shim = document.createElement("div");
      shim.className = "viewport-shim";
      modal.appendChild(shim);
    }
  }
  function detachViewportShim(modal){
    modal.querySelector(".viewport-shim")?.remove();
  }

  function fmtHHMM(epochMs){
    try{
      const d = new Date(epochMs);
      return d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    }catch(e){ return "—"; }
  }

  function delayInfo(a){
    // Uses realtimeDelay if present; fall back to scheduled vs realtime
    if(!a) return {label:null, cls:"delay-neutral"};

    const d = (typeof a.realtimeDelay === "number") ? a.realtimeDelay : null;
    if(d==null) return {label:null, cls:"delay-neutral"};

    // Negative means early; positive means delayed
    const min = Math.round(d/60);
    if(min===0) return {label:"En hora", cls:"delay-ok"};
    if(min>0){
      if(min>=5) return {label:`+${min} min`, cls:"delay-bad"};
      return {label:`+${min} min`, cls:"delay-warn"};
    }
    return {label:`${min} min`, cls:"delay-warn"};
  }

  function fmtEtaOrClock(sec, status, clock){
    if(status && /cancel/i.test(status)) return "Cancelado";
    if(!Number.isFinite(sec)) return clock || "—";
    if(sec<=0) return "Ahora";
    if(sec<60) return `${sec} s`;
    return `${Math.ceil(sec/60)} min`;
  }

  function setEmptyState(){
    const any = Object.keys(panels).length>0;
    $("#emptyState").style.display = any ? "none" : "block";
  }

  /* ========= Rendering ========= */
  function lineIcon(type){ return type==="tram" ? "tram" : "directions_bus"; }

  function computeAccent(line){
    const key = line.code;
    if(colorCache[key]) return colorCache[key];

    // simple deterministic hash to generate hue
    let h=0;
    for(const ch of key) h = (h*31 + ch.charCodeAt(0))>>>0;
    const hue = h % 360;
    const col = `hsl(${hue} 80% 60%)`;
    colorCache[key] = col;
    saveJSON("line_colors", colorCache);
    return col;
  }

  function createPanel(instanceId, line){
    const accent = computeAccent(line);
    const el = document.createElement("div");
    el.className = "card";
    el.id = `panel-${instanceId}`;
    el.dataset.instanceId = instanceId;
    el.style.setProperty("--line-accent", accent);

    el.innerHTML = `
      <div class="card-inner">
        <div class="card-head">
          <div class="line-pill" style="border-color: color-mix(in oklab, var(--line-accent) 50%, rgba(255,255,255,.14)); background: color-mix(in oklab, var(--line-accent) 18%, rgba(0,0,0,.10));">
            <i class="material-icons" aria-hidden="true">${lineIcon(line.type)}</i>
            <span class="line-code">${escapeHtml(line.code)}</span>
            <span style="font-weight:800; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px">${escapeHtml(line.name)}</span>
          </div>

          <div class="card-tools">
            <div class="iconbtn" title="Cambiar parada" data-action="stops"><i class="material-icons">place</i></div>
            <div class="iconbtn" title="Eliminar" data-action="remove"><i class="material-icons">delete</i></div>
          </div>
        </div>

        <div class="row">
          <div class="stop-name">
            <span id="stop-${instanceId}">Selecciona una parada</span>
          </div>
          <span class="pill" id="badge-${instanceId}" style="display:none">Live</span>
        </div>

        <div id="info-${instanceId}">
          <div class="next-time" style="opacity:.7">—</div>
          <div class="hint">Sin datos</div>
        </div>

        <div class="notice" id="notice-${instanceId}"></div>
      </div>
    `;

    // card tools events
    el.addEventListener("click", (e)=>{
      const btn = e.target.closest("[data-action]");
      if(!btn) return;
      const action = btn.dataset.action;
      if(action==="remove") removePanel(instanceId);
      if(action==="stops") openStops(instanceId);
    });

    return el;
  }

  function renderAddList(){
    const q = ($("#addSearchInput").value || "").toLowerCase().trim();
    let arr = lines.slice();

    if(addFilter!=="all") arr = arr.filter(l=>l.type===addFilter);
    if(q) arr = arr.filter(l=> (l.code+l.name).toLowerCase().includes(q));

    const list = $("#addList");
    list.innerHTML = "";

    if(!arr.length){
      list.innerHTML = `<div class="empty">No hay resultados.</div>`;
      return;
    }

    const wrap = document.createElement("div");
    wrap.className = "list";
    arr.forEach(line=>{
      const item = document.createElement("div");
      item.className = "item";
      item.role="option";
      item.innerHTML = `
        <div>
          <strong>${escapeHtml(line.code)} · ${escapeHtml(line.name)}</strong><br/>
          <small>${line.type==="tram" ? "Tranvía" : "Autobús"}</small>
        </div>
        <i class="material-icons" style="opacity:.85">add_circle</i>
      `;
      item.addEventListener("click", ()=>{
        addLine(line);
        closeAddModal();
      });
      wrap.appendChild(item);
    });
    list.appendChild(wrap);
  }

  function setAddFilter(f){
    addFilter=f;
    ["chipAll","chipBus","chipTram"].forEach(id=>$("#"+id).classList.remove("active"));
    $("#chip"+(f==="all"?"All":(f==="bus"?"Bus":"Tram"))).classList.add("active");
    renderAddList();
  }

  /* ========= Persistence ========= */
  function loadPanels(){
    const saved = loadJSON("panels", []);
    saved.forEach(p=>{
      const line = lines.find(l=> l.code===p.lineCode);
      if(!line) return;
      const instanceId = p.instanceId || crypto.randomUUID();
      panels[instanceId] = {
        instanceId,
        line,
        currentStopId: p.stopId || null,
        currentStopName: p.stopName || null,
      };
      mountPanel(instanceId);
    });
    setEmptyState();
  }
  function savePanels(){
    const arr = Object.values(panels).map(p=>({
      instanceId: p.instanceId,
      lineCode: p.line.code,
      stopId: p.currentStopId,
      stopName: p.currentStopName,
    }));
    saveJSON("panels", arr);
  }

  function addLine(line){
    const instanceId = crypto.randomUUID();
    panels[instanceId] = {
      instanceId,
      line,
      currentStopId: null,
      currentStopName: null
    };
    mountPanel(instanceId);
    savePanels();
    setEmptyState();
  }

  function mountPanel(instanceId){
    const p = panels[instanceId];
    const el = createPanel(instanceId, p.line);
    $("#panels-container").appendChild(el);

    if(p.currentStopName){
      $(`#stop-${instanceId}`).textContent = p.currentStopName;
    }
    // initial fetch if stop already set
    if(p.currentStopId) refreshPanel(instanceId);
  }

  function removePanel(instanceId){
    delete panels[instanceId];
    document.getElementById(`panel-${instanceId}`)?.remove();
    savePanels();
    setEmptyState();
  }

  /* ========= Data fetch & refresh ========= */
  function scheduleAutoRefresh(){
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(refreshAll, 15000);
  }

  function startGlobalTick(){
    if(globalTickTimer) clearInterval(globalTickTimer);
    globalTickTimer = setInterval(()=>{
      // Update per-second countdown spans
      $$(".tram-sec").forEach(span=>{
        const v = Number(span.dataset.seconds);
        if(!Number.isFinite(v)) return;
        const next = v-1;
        span.dataset.seconds = String(next);
        span.textContent = String(Math.max(0,next));
      });
      // Update bus main counters if showing seconds (rare)
      // (handled by refresh)
    }, 1000);
  }

  async function refreshAll(){
    globalLastRefresh = Date.now();
    const ids = Object.keys(panels);
    for(const id of ids){
      if(panels[id].currentStopId) refreshPanel(id);
    }
  }

  async function refreshPanel(instanceId){
    const p = panels[instanceId];
    if(!p || !p.currentStopId) return;

    const stopId = p.currentStopId;
    const line = p.line;

    // For bus lines, route id in arrivals endpoint is usually the numeric code without leading "L" (except L2A/L2B)
    const routeCode = line.type==="tram" ? line.code : (line.code.startsWith('L') && !['L2A','L2B'].includes(line.code) ? line.code.substring(1) : line.code);

    const url = ARRIVALS_TPL.replace("{stopId}", stopId).replace("{lineCode}", routeCode);

    try{
      const data = await getJSON(url);
      const arrivals = (data && data.llegadas) ? data.llegadas : [];
      const notices = (data && data.avisos) ? data.avisos : [];

      const badge = $(`#badge-${instanceId}`);
      badge.style.display = "inline-flex";
      badge.textContent = "Live";

      const noticeEl = $(`#notice-${instanceId}`);
      if(notices && notices.length){
        noticeEl.classList.add("show");
        noticeEl.innerHTML = `<strong> Avisos </strong><br/>` + notices.map(n=>`• ${escapeHtml(n)}`).join("<br/>");
      }else{
        noticeEl.classList.remove("show");
        noticeEl.textContent = "";
      }

      if(line.type==="tram"){
        // Tram: arrivals include destination
        const byDest = {};
        arrivals.filter(a=>a.line===line.code).forEach(a=>{
          const dest = a.destination || "—";
          (byDest[dest] ||= []).push(a);
        });

        const blocks = Object.entries(byDest).map(([dest, arr])=>{
          arr.sort((a,b)=> (a.seconds??1e9)-(b.seconds??1e9));
          const nx = arr[0] || null;
          const rest = arr.slice(1);
          return renderDestinationBlock(instanceId, dest, nx, rest);
        }).join("");

        $(`#info-${instanceId}`).innerHTML = blocks || `<div class="hint">Sin llegadas para esta línea.</div>`;
      }else{
        // Bus: filter by routeCode
        const arr = arrivals.filter(a=>a.line===routeCode);
        arr.sort((a,b)=> (a.seconds??1e9)-(b.seconds??1e9));
        const nx = arr[0] || null;

        if(!nx){
          $(`#info-${instanceId}`).innerHTML = `
            <div class="next-time" style="opacity:.7">—</div>
            <div class="hint">Sin llegadas previstas</div>
          `;
          return;
        }

        const hour = typeof nx.realtimeArrival === 'number' ? fmtHHMM(nx.realtimeArrival)
                    : (typeof nx.scheduledArrival === 'number' ? `≈${fmtHHMM(nx.scheduledArrival)}` : '—');

        const secVal = (nx && nx.seconds != null) ? Number(nx.seconds) : NaN;
        const etaBig = fmtEtaOrClock(Number.isFinite(secVal) ? secVal : nx.seconds, nx.status, hour);
        const dly = delayInfo(nx);
        const etaSmall = Number.isFinite(secVal)
          ? (secVal < 60 ? `en ${secVal}s` : `en ${Math.ceil(secVal/60)} min`)
          : '';

        const chips = arr.slice(1,4).map(a=>{
          const h = typeof a.realtimeArrival === 'number' ? fmtHHMM(a.realtimeArrival)
                  : (typeof a.scheduledArrival === 'number' ? `≈${fmtHHMM(a.scheduledArrival)}` : '—');
          const aSec = (a && a.seconds != null) ? Number(a.seconds) : NaN;
          const eta = Number.isFinite(aSec) ? (aSec < 60 ? `en ${aSec} s` : `en ${Math.ceil(aSec/60)} min`) : '';
          const dl = delayInfo(a);
          return { hourText: h, bigText: eta || "—", delayLabel: dl.label, delayCls: dl.cls };
        });

        $(`#info-${instanceId}`).innerHTML = `
          <div class="next-time timeline-trigger" role="button" tabindex="0" title="Ver siguientes paradas" id="count-${instanceId}">${
            (Number.isFinite(secVal) && secVal < 60)
              ? `<span class="tram-sec" data-seconds="${secVal}">${secVal}</span> s`
              : `${escapeHtml(etaBig)}`
          }
            ${dly.label ? `<span class="delay ${dly.cls}">${escapeHtml(dly.label)}</span>` : ``}
          </div>
          <div class="hint">
            <span>Hora: <strong>${escapeHtml(hour)}</strong></span>
            ${etaBig === hour && etaSmall ?'<span class="dot"></span><span>'+escapeHtml(etaSmall)+'</span>':''}
          </div>
          ${chips.length ? `
            <div class="arrivals">
              ${chips.map(c=>`
                <div class="chip">
                  <span class="when">${escapeHtml(c.bigText)}</span>
                  <span class="clock">${escapeHtml(c.hourText)}</span>
                  ${c.delayLabel ? `<span class="delay ${c.delayCls}">${escapeHtml(c.delayLabel)}</span>` : ``}
                </div>
              `).join("")}
            </div>
          `:''}
        `;
      }

    }catch(err){
      console.warn("refresh error", err);
      const badge = $(`#badge-${instanceId}`);
      badge.style.display = "none";
      $(`#info-${instanceId}`).innerHTML = `
        <div class="next-time" style="opacity:.7">—</div>
        <div class="hint">Error al cargar</div>
      `;
    }
  }

  function renderDestinationBlock(instanceId, destName, nx, restArr){
    const isTram = panels[instanceId].line.type === "tram";

    const hour = typeof nx.realtimeArrival === 'number' ? fmtHHMM(nx.realtimeArrival)
                : (typeof nx.scheduledArrival === 'number' ? `≈${fmtHHMM(nx.scheduledArrival)}` : '—');

    const secVal = (nx && nx.seconds != null) ? Number(nx.seconds) : NaN;

    const etaBig = fmtEtaOrClock(Number.isFinite(secVal) ? secVal : nx.seconds, nx.status, hour);
    const dly = delayInfo(nx);
    const etaSmall = Number.isFinite(secVal)
      ? (secVal < 60 ? `en ${secVal}s` : `en ${Math.ceil(secVal/60)} min`)
      : '';

    const chips = restArr.slice(0,2).map(a=>{
      const h = typeof a.realtimeArrival === 'number' ? fmtHHMM(a.realtimeArrival)
              : (typeof a.scheduledArrival === 'number' ? `≈${fmtHHMM(a.scheduledArrival)}` : '—');
      const aSec = (a && a.seconds != null) ? Number(a.seconds) : NaN;
      const eta = Number.isFinite(aSec) ? (aSec < 60 ? `en ${aSec} s` : `en ${Math.ceil(aSec/60)} min`) : '';
      const dl = delayInfo(a);
      return { hourText: h, bigText: eta || "—", delayLabel: dl.label, delayCls: dl.cls };
    });

    return `
      <div class="dest-block">
        <div class="dest-head">
          <span class="dest-pill ${isTram ? 'dir-pill' : ''}">
            <i class="material-icons" aria-hidden="true">${isTram?'tram':'directions_bus'}</i>
            <span class="dest-label">${isTram ? 'Dirección' : 'Destino'}</span>
            <span class="dest-value">${escapeHtml(destName)}</span>
          </span>
        </div>

        <div>
          <div class="next-time timeline-trigger" role="button" tabindex="0" data-dest="${escapeHtml(destName)}" title="Ver siguientes paradas">${
            (Number.isFinite(secVal) && secVal < 60)
              ? `<span class="tram-sec" data-seconds="${secVal}">${secVal}</span> s`
              : `${escapeHtml(etaBig)}`
          }</div>
          <div class="hint">
            <span>Hora: <strong>${escapeHtml(hour)}</strong></span>
            ${etaBig === hour && etaSmall ?'<span class="dot"></span><span>'+escapeHtml(etaSmall)+'</span>':''}
            ${dly.label ? `<span class="dot"></span><span class="delay ${dly.cls}">${escapeHtml(dly.label)}</span>` : ``}
          </div>

          ${chips.length ? `
            <div class="arrivals">
              ${chips.map(c=>`
                <div class="chip">
                  <span class="when">${escapeHtml(c.bigText)}</span>
                  <span class="clock">${escapeHtml(c.hourText)}</span>
                  ${c.delayLabel ? `<span class="delay ${c.delayCls}">${escapeHtml(c.delayLabel)}</span>` : ``}
                </div>
              `).join("")}
            </div>
          `:''}
        </div>
      </div>
    `;
  }

  /* ========= Add modal ========= */
  function openAddModal(){
    renderAddList();
    $("#addModal").classList.add("open");
    $("#addSearchInput").value = "";
    lockBodyScroll();
    attachViewportShim($("#addModal"));
    setTimeout(()=> $("#addSearchInput").focus(), 20);
  }
  function closeAddModal(){
    $("#addModal").classList.remove("open");
    detachViewportShim($("#addModal"));
    unlockBodyScroll();
  }

  /* ========= Timeline modal ========= */
  let currentTimeline = { instanceId:null, dest:null, abort:null };

  function closeTimeline(){
    const modal = $("#timelineModal");
    if (!modal) return;
    modal.classList.remove("open");
    detachViewportShim(modal);
    unlockBodyScroll();
    if (currentTimeline.abort) currentTimeline.abort.abort();
    currentTimeline = { instanceId:null, dest:null, abort:null };
  }

  function mapLimit(items, limit, mapper){
    const ret = [];
    let i = 0;
    const workers = Array.from({length: Math.min(limit, items.length)}, async ()=>{
      while(i < items.length){
        const idx = i++;
        ret[idx] = await mapper(items[idx], idx);
      }
    });
    return Promise.all(workers).then(()=>ret);
  }

  function pickArrivalForLine(data, { line, routeCode, isTram, dest }){
    let arr = (data?.llegadas || []);
    if (isTram){
      arr = arr.filter(x => x.line === line.code);
      if (dest) arr = arr.filter(x => String(x.destination||"") === String(dest));
    }else{
      arr = arr.filter(x => x.line === routeCode);
    }
    if (!arr.length) return null;
    arr.sort((a,b)=>(a.seconds??1e9)-(b.seconds??1e9));
    return arr[0];
  }

  function arrivalToUi(a){
    if(!a) return { eta:"—", clock:"—", delay:null, delayCls:"delay-neutral" };

    const hour = typeof a.realtimeArrival === "number" ? fmtHHMM(a.realtimeArrival)
              : (typeof a.scheduledArrival === "number" ? `≈${fmtHHMM(a.scheduledArrival)}` : "—");

    const sec = (a && a.seconds != null) ? Number(a.seconds) : NaN;
    const eta = Number.isFinite(sec) ? (sec < 60 ? `${sec} s` : `${Math.ceil(sec/60)} min`) : "—";
    const dly = delayInfo(a);

    return { eta, clock: hour, delay: dly.label, delayCls: dly.cls };
  }

  async function openTimeline(instanceId, dest=null){
    const p = panels[instanceId];
    if(!p?.line || !p.currentStopId) return;

    // Cancelar carga anterior si existía
    if (currentTimeline.abort) currentTimeline.abort.abort();
    const abort = new AbortController();
    currentTimeline = { instanceId, dest, abort };

    const modal = $("#timelineModal");
    const list = $("#timelineList");
    if (!modal || !list) return;

    // UI base
    const isTram = p.line.type === "tram";
    $("#timelineModalTitle").textContent = `Siguientes paradas • ${p.line.code}`;
    $("#timelineModalSub").innerHTML = `
      <span class="tl-badge"><i class="material-icons" style="font-size:16px">place</i>${escapeHtml(p.currentStopName || "Parada")}</span>
      ${dest ? `<span class="tl-badge"><i class="material-icons" style="font-size:16px">${isTram?'tram':'directions_bus'}</i>${escapeHtml(dest)}</span>` : ``}
      <span class="tl-badge"><i class="material-icons" style="font-size:16px">schedule</i>Estimado en tiempo real</span>
    `;

    // Acento del panel
    const accent = getComputedStyle($("#panel-"+instanceId)).getPropertyValue("--line-accent") || "var(--primary)";
    modal.querySelector(".sheet").style.setProperty("--line-accent", accent.trim());

    list.innerHTML = `<div style="padding:14px;color:var(--muted)">Cargando paradas…</div>`;
    modal.classList.add("open");
    lockBodyScroll();
    attachViewportShim(modal);

    try{
      // 1) Recuperar recorrido
      const routeData = await getJSON(p.line.stopsUrl);
      if (!routeData || !Array.isArray(routeData.recorrido)) throw new Error("Sin recorrido");

      const recorrido = routeData.recorrido;
      const idx = recorrido.findIndex(s => String(s.idParada) === String(p.currentStopId));
      const from = Math.max(0, idx);
      const MAX_NEXT = 8; // ajustable
      const slice = recorrido.slice(from, from + 1 + MAX_NEXT);

      // 2) Calcular routeCode como en refreshPanel()
      const routeCode = isTram
        ? p.line.code
        : ((p.line.code.startsWith('L') && !['L2A','L2B'].includes(p.line.code)) ? p.line.code.substring(1) : p.line.code);

      // 3) Para cada parada, pedir llegadas y tomar la primera de la línea (y destino si aplica)
      list.innerHTML = `<div style="padding:14px;color:var(--muted)">Calculando horas por parada…</div>`;

      const results = await mapLimit(slice, 4, async (st, i)=>{
        if (abort.signal.aborted) return null;

        const stopId = st.idParada;
        const url = ARRIVALS_TPL.replace("{stopId}", stopId).replace("{lineCode}", routeCode);

        const toFetch = toProxiedUrl(url);
        const res = await fetch(toFetch, { cache:"no-store", signal: abort.signal });
        if(!res.ok) throw new Error("HTTP " + res.status);

        const txt = await res.text();
        const data = tryParseJSON(txt);

        const a = pickArrivalForLine(data, { line: p.line, routeCode, isTram, dest });
        const ui = arrivalToUi(a);

        return {
          stopId,
          name: st.nombre,
          isCurrent: i===0,
          eta: ui.eta,
          clock: ui.clock,
          delay: ui.delay,
          delayCls: ui.delayCls
        };
      });

      if (abort.signal.aborted) return;

      // 4) Render timeline
      const safe = results.filter(Boolean);
      if (!safe.length){
        list.innerHTML = `<div style="padding:14px;color:var(--muted)">No hay datos para mostrar.</div>`;
        return;
      }

      list.innerHTML = safe.map((it, i)=>{
        const isLast = i === safe.length - 1;
        return `
          <div class="tl-item ${it.isCurrent ? 'tl-current' : ''}">
            <div class="tl-rail" aria-hidden="true">
              <div class="tl-dot"></div>
              ${isLast ? '' : '<div class="tl-line"></div>'}
            </div>

            <div class="tl-main">
              <div class="tl-stop">${escapeHtml(it.name)}</div>
              <div class="tl-meta">
                ${it.isCurrent ? `<span class="pill">Parada actual</span>` : ``}
                ${it.delay ? `<span class="delay ${it.delayCls}">${escapeHtml(it.delay)}</span>` : ``}
              </div>
            </div>

            <div class="tl-right">
              <div class="tl-eta">${escapeHtml(it.eta)}</div>
              <div class="tl-clock">Hora: <strong>${escapeHtml(it.clock)}</strong></div>
            </div>
          </div>
        `;
      }).join("");

    }catch(err){
      if (abort.signal.aborted) return;
      console.warn("Timeline error", err);
      list.innerHTML = `<div style="padding:14px;color:var(--muted)">⚠️ No se pudieron calcular las horas para las siguientes paradas.</div>`;
    }
  }


  /* ========= Stops modal ========= */
  async function openStops(instanceId){
    currentStopsForInstance = instanceId;
    const p = panels[instanceId];
    if(!p) return;

    $("#stopsModalTitle").textContent = `Paradas · ${p.line.code}`;
    $("#stopsListContainer").innerHTML = `<div class="empty">Cargando paradas…</div>`;

    $("#stopsModal").classList.add("open");
    lockBodyScroll();
    attachViewportShim($("#stopsModal"));

    try{
      const data = await getJSON(p.line.stopsUrl);
      const stops = (data && data.recorrido) ? data.recorrido : [];

      const cont = $("#stopsListContainer");
      cont.innerHTML = "";

      if(!stops.length){
        cont.innerHTML = `<div class="empty">No se pudieron cargar paradas.</div>`;
        return;
      }

      // If API provides coordinates
      const hasGeo = stops.some(s=> Number.isFinite(+s.latitud) && Number.isFinite(+s.longitud));
      if(hasGeo){
        const info = document.createElement("div");
        info.className = "empty";
        info.style.textAlign = "left";
        info.style.padding = "10px 8px";
        info.innerHTML = `Tip: usa <strong>📍</strong> para ordenar por cercanía.`;
        cont.appendChild(info);
      }

      stops.forEach(s=>{
        const item = document.createElement("div");
        item.className = "item stop-item";
        item.role = "option";
        item.dataset.name = s.nombre || "";
        item.dataset.lat = s.latitud ?? "";
        item.dataset.lng = s.longitud ?? "";

        item.innerHTML = `
          <div style="min-width:0">
            <strong>${escapeHtml(s.nombre || "Parada")}</strong><br/>
            <small>ID: ${escapeHtml(s.idParada)}</small>
          </div>
          <i class="material-icons" style="opacity:.85">chevron_right</i>
        `;

        item.addEventListener("click", ()=>{
          setStop(instanceId, s.idParada, s.nombre);
          closeStops();
        });

        cont.appendChild(item);
      });

    }catch(err){
      console.warn("stops error", err);
      $("#stopsListContainer").innerHTML = `<div class="empty">Error cargando paradas.</div>`;
    }
  }
  function closeStops(){
    $("#stopsModal").classList.remove("open");
    detachViewportShim($("#stopsModal"));
    unlockBodyScroll();
  }

  function setStop(instanceId, stopId, stopName){
    const p = panels[instanceId];
    if(!p) return;

    p.currentStopId = stopId;
    p.currentStopName = stopName;
    $(`#stop-${instanceId}`).textContent = stopName;
    savePanels();
    refreshPanel(instanceId);
  }

  /* ========= Init ========= */
  document.addEventListener('DOMContentLoaded', ()=>{
    $("#navAdd").addEventListener("click", openAddModal);
    $("#navRefresh").addEventListener('click', ()=>{
      const ic=$("#navRefresh i");
      ic.classList.add('spin');
      refreshAll();
      setTimeout(()=>ic.classList.remove('spin'), 900);
    });

    $("#themeToggle").addEventListener('click', cycleTheme);

    $("#closeAdd").addEventListener("click", closeAddModal);
    $("#addModal").addEventListener("click", (e)=>{ if (e.target===e.currentTarget) closeAddModal(); });
    $("#addSearchInput").addEventListener("input", renderAddList);
    $("#chipAll").addEventListener("click", ()=> setAddFilter("all"));
    $("#chipBus").addEventListener("click", ()=> setAddFilter("bus"));
    $("#chipTram").addEventListener("click", ()=> setAddFilter("tram"));

    $("#closeStops").addEventListener('click', closeStops);
    $("#stopsModal").addEventListener('click', e=>{ if(e.target===e.currentTarget) closeStops(); });

    // Cerrar modal timeline
    $("#closeTimeline").addEventListener("click", closeTimeline);
    $("#timelineModal").addEventListener("click", (e)=>{ if(e.target===e.currentTarget) closeTimeline(); });

    // Delegación: click en contador (bus) o en bloque (tranvía)
    $("#panels-container").addEventListener("click", (e)=>{
      const trg = e.target.closest(".timeline-trigger");
      if(!trg) return;

      const card = e.target.closest(".card");
      const instanceId = card?.dataset?.instanceId;
      if(!instanceId) return;

      const dest = trg.dataset?.dest || null; // para tranvía (opcional)
      openTimeline(instanceId, dest);
    });

    // Accesibilidad teclado (Enter/Espacio)
    $("#panels-container").addEventListener("keydown", (e)=>{
      const trg = e.target.closest(".timeline-trigger");
      if(!trg) return;
      if(e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();

      const card = e.target.closest(".card");
      const instanceId = card?.dataset?.instanceId;
      if(!instanceId) return;

      const dest = trg.dataset?.dest || null;
      openTimeline(instanceId, dest);
    });

    document.addEventListener('keydown', e=>{
      if(e.key==='Escape'){
        closeAddModal();
        closeStops();
        closeTimeline();
      }
    });

    $("#stopSearchInput").addEventListener('input', function(){
      const q=this.value.toLowerCase();
      $$("#stopsListContainer .stop-item").forEach(it=>{
        const name = (it.dataset.name || it.textContent || "").toLowerCase();
        it.style.display = name.includes(q) ? "" : "none";
      });
    });

    $("#nearbyStopsBtn").addEventListener('click', ()=>{
      if (!navigator.geolocation) return alert("La geolocalización no está disponible.");
      navigator.geolocation.getCurrentPosition(pos=>{
        const {latitude,longitude}=pos.coords;
        const items=$$("#stopsListContainer .stop-item");
        const hav=(lat1,lon1,lat2,lon2)=>{
          const R=6371000, toRad=d=>d*Math.PI/180;
          const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
          const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
          return 2*R*Math.asin(Math.sqrt(a));
        };
        const arr=items.map(el=>{
          const lat=parseFloat(el.dataset.lat), lng=parseFloat(el.dataset.lng);
          const d=(Number.isFinite(lat)&&Number.isFinite(lng))?hav(latitude,longitude,lat,lng):Number.POSITIVE_INFINITY;
          return {el,d};
        }).sort((a,b)=>a.d-b.d);

        const cont=$("#stopsListContainer");
        const fixed = Array.from(cont.children).filter(ch=>!ch.classList.contains("stop-item"));
        cont.innerHTML = "";
        fixed.forEach(x=>cont.appendChild(x));
        arr.forEach(x=>cont.appendChild(x.el));
      }, _=>alert("No se pudo obtener tu ubicación."));
    });

    window.addEventListener('online', ()=> $("#offlineBanner").style.display = 'none');
    window.addEventListener('offline', ()=> $("#offlineBanner").style.display = 'block');
    $("#offlineBanner").style.display = navigator.onLine ? 'none' : 'block';

    applyTheme(pref());
    if (window.matchMedia){
      window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{
        if(localStorage.getItem("theme")==="auto") applyTheme("auto");
      });
    }

    loadPanels();
    scheduleAutoRefresh();
    startGlobalTick();
    refreshAll();
  });
  </script>
</body>
</html>
