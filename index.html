<!DOCTYPE html>
<html lang="es" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gasteiz Lines — Bus & Tranvía</title>

  <meta id="metaThemeLight" name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)">
  <meta id="metaThemeDark"  name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://maps.googleapis.com/maps/api/js?key=xxx"></script>

  <style>
    :root{
      --bg:#f6f8fc;--bg-accent:radial-gradient(1200px 520px at 50% -10%,color-mix(in oklab,var(--primary) 14%,transparent) 0%,transparent 60%);
      --surface:rgba(255,255,255,.7);--surface-2:rgba(246,248,252,.75);--glass-border:rgba(15,23,42,.08);
      --text:#0f172a;--muted:#64748b;--primary:#0b63ff;--primary-600:#0751d0;--accent-bus:#22c55e;--accent-tram:#e11d48;--danger:#ef4444;
      --radius:16px;--shadow:0 12px 40px rgba(16,24,40,.12);--ring:0 0 0 3px rgba(11,99,255,.25);color-scheme:light;
    }
    html[data-theme=dark]{
      --bg:#0b1220;--bg-accent:radial-gradient(1200px 520px at 50% -10%,color-mix(in oklab,var(--primary) 20%,transparent) 0%,transparent 60%);
      --surface:rgba(17,24,39,.6);--surface-2:rgba(15,23,42,.55);--glass-border:rgba(255,255,255,.08);
      --text:#e5e7eb;--muted:#93a4b7;--primary:#3b82f6;--primary-600:#2563eb;--danger:#f87171;
      --shadow:0 18px 48px rgba(0,0,0,.45);--ring:0 0 0 3px rgba(59,130,246,.25);color-scheme:dark;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    html{ -webkit-text-size-adjust: 100%; }
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;background:var(--bg-accent),var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
    body.modal-open{overflow:hidden;height:100%}
    html.theme-switching *{transition:background-color .25s,color .25s,border-color .25s,box-shadow .25s}
    .app{max-width:1080px;margin:0 auto;padding:16px clamp(12px,4vw,24px) 96px;display:grid;gap:16px}

    header.appbar{position:sticky;top:0;z-index:50;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px clamp(12px,4vw,24px);margin:-16px calc(clamp(12px,4vw,24px)*-1) 0;background:color-mix(in oklab,var(--surface) 70%,transparent);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--glass-border)}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--primary) 0%,#22c55e 100%);box-shadow:0 10px 24px color-mix(in oklab,var(--primary) 30%,transparent)}
    .title{display:grid;line-height:1.05}.title strong{font-size:18px;letter-spacing:-.2px}.title span{font-size:12px;color:var(--muted)}
    .actions{display:flex;gap:10px;align-items:center}
    .btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:10px 12px;border-radius:14px;border:1px solid var(--glass-border);background:var(--surface);cursor:pointer;box-shadow:0 1px 0 rgba(16,24,40,.03);transition:transform .06s,box-shadow .2s}
    @media (hover: hover) and (pointer: fine){
      .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
      .icon:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
      .nav-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
    }
    @media (hover: none) and (pointer: coarse){
      .btn:hover,.icon:hover,.nav-btn:hover{transform:none;box-shadow:0 1px 0 rgba(16,24,40,.03)}
    }
    .btn:active{transform:scale(.98)}.btn i{font-size:20px}.btn span{font-size:12px;color:var(--muted)}

    .offline-banner{position:sticky;top:0;z-index:49;margin:0 -16px;padding:10px 16px;background:#fee2e2;color:#991b1b;border-bottom:1px solid #fecaca;display:none;font-size:13px}
    html[data-theme=dark] .offline-banner{background:#3f1d1d;color:#fecaca;border-color:#7f1d1d}

    .warn-banner{display:none;margin:-6px 0 6px;border:1px solid var(--glass-border);background:color-mix(in oklab,var(--surface) 90%,#fde68a 10%);padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.35}
    html[data-theme=dark] .warn-banner{background:color-mix(in oklab,var(--surface) 85%,#a16207 15%)}

    .grid{display:grid;gap:16px}
    .card{
      position:relative;border:1px solid var(--glass-border);background:var(--surface);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:14px;display:grid;gap:12px;overflow:clip;backdrop-filter:blur(14px) saturate(1.25)
    }
    .card{touch-action: pan-y;-webkit-user-drag:none;user-select:none}
    .card::after{content:"";position:absolute;inset:-1px -1px auto -1px;height:6px;border-radius:16px 16px 0 0;background:var(--line-accent,var(--primary));opacity:.9;pointer-events:none}

    .line-head{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}
    .line-meta{min-width:0}
    .line-row{display:flex;align-items:center;gap:10px;min-width:0}
    .line-pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:4px 10px;border-radius:999px;font-weight:900;letter-spacing:.2px;font-size:12px;line-height:1.4;
      background: color-mix(in oklab, var(--line-accent) 18%, var(--surface));
      border:1px solid color-mix(in oklab, var(--line-accent) 45%, var(--glass-border));
      color: var(--text); white-space:nowrap;
    }
    .line-pill i{font-size:16px;color:color-mix(in oklab, var(--line-accent) 80%, var(--text));}
    .line-name{font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;min-width:0}

    .panel-menu{display:inline-grid;grid-auto-flow:column;gap:8px;align-items:center}
    .icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--glass-border);background:var(--surface);cursor:pointer;transition:transform .06s,box-shadow .2s;color:var(--text)}
    .icon:active{transform:scale(.98)}
    .icon.is-pinned{background:var(--primary);color:#fff}

    .stop-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--glass-border);background:var(--surface-2)}
    .stop-picker{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:0;text-align:left;cursor:pointer;color:inherit}
    .stop-picker i{font-size:18px;color:var(--primary)}
    .stop-picker .caret{margin-left:auto}
    .stop-picker:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
    .stop-name{font-weight:800;letter-spacing:-.2px}
    .stop-picker:hover .stop-name{text-decoration:underline}

    .fav{background:none;border:none;cursor:pointer;font-size:20px;color:var(--primary)}.fav.selected{color:#f59e0b}

    .stack{display:grid;gap:12px;justify-items:center;text-align:center}
    .next-time{font-size:clamp(40px,9vw,72px);font-weight:900;letter-spacing:-1px;line-height:.95;font-variant-numeric:tabular-nums;transition:transform .2s,opacity .2s;will-change:transform}
    .next-time.tick{transform:translateY(-2px) scale(1.02);opacity:.95}
    .hint{color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}

    .badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    .badge{border:1px solid var(--glass-border);background:var(--surface-2);padding:8px 10px;border-radius:999px;font-size:12px;display:grid;gap:2px;text-align:center;backdrop-filter:blur(8px) saturate(1.2)}
    .badge .time{font-weight:800}.badge .left{color:var(--muted);font-size:11px}

    .tram-stack{display:grid;gap:16px;justify-items:center;align-items:stretch}
    @media (min-width: 640px){ .tram-stack{ grid-template-columns: repeat(2, minmax(260px,1fr)); } }
    @media (min-width: 880px){ .tram-stack{ grid-template-columns: repeat(2, minmax(320px,1fr)); } }

    .tram-group{border:1px solid var(--glass-border);border-radius:14px;padding:12px;background:var(--surface-2);backdrop-filter:blur(8px) saturate(1.2);text-align:center;width:100%;max-width:560px;}
    .tram-dest{color:var(--primary);font-weight:900;margin-bottom:4px}
    .tram-count{font-size:28px;font-weight:900;will-change:transform}

    @keyframes pulse{0%{transform:scale(1);text-shadow:none}50%{transform:scale(1.045);text-shadow:0 0 .35rem color-mix(in oklab,var(--primary) 35%, transparent)}100%{transform:scale(1);text-shadow:none}}
    .is-urgent{animation:pulse 1.2s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){.is-urgent{animation:none}}

    .skeleton{position:relative;overflow:hidden;background:color-mix(in oklab,var(--surface-2) 80%,transparent);border:1px solid var(--glass-border);border-radius:10px;height:16px}
    .skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in oklab,var(--surface) 92%,white 8%),transparent);animation:shimmer 1.1s infinite}
    @keyframes shimmer{100%{transform:translateX(100%)}}

    .modal{position:fixed;inset:0;display:none;place-items:center;padding:16px;z-index:60;background:rgba(0,0,0,.35);overscroll-behavior:contain}
    .modal.open{display:grid}
    .sheet{
      width:min(760px,96vw);
      max-height:88vh;
      overflow:auto;
      background:var(--surface);
      border:1px solid var(--glass-border);
      border-radius:18px;box-shadow:var(--shadow);padding:14px;
      backdrop-filter:blur(12px) saturate(1.25);animation:pop .15s ease
    }
    #stopsModal .sheet, #lineModal .sheet{display:flex;flex-direction:column}
    #stopsListContainer, #lineList{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;overflow-anchor:none}
    @supports (height: 100dvh){ .sheet{ max-height:min(80dvh,88vh); } }
    @keyframes pop{from{transform:translateY(6px);opacity:0}}

    .search{width:100%;border:1px solid var(--glass-border);background:var(--surface);color:var(--text);padding:12px;border-radius:12px;margin:8px 0 10px;font: inherit;}
    @media (max-width: 600px){ .search{ font-size:17px; line-height:1.25; } }

    .list{list-style:none;margin:0;padding:0}
    .list li,.stop-item{padding:12px;border-bottom:1px solid var(--glass-border);cursor:pointer}
    .list li:hover,.stop-item:hover{background:color-mix(in oklab,var(--surface) 90%,transparent)}
    .stop-item.selected{background:color-mix(in oklab,var(--surface) 86%,transparent)}

    #mapWrap{width:min(980px,96vw);height:min(80vh,700px);border-radius:18px;overflow:hidden;position:relative;border:1px solid var(--glass-border);box-shadow:var(--shadow);background:var(--surface)}
    #map{width:100%;height:100%}.map-close{position:absolute;top:10px;right:10px;z-index:5;border:none;border-radius:12px;padding:8px 10px;background:var(--primary);color:#fff;cursor:pointer;box-shadow:var(--shadow)}

    .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:55;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:center;padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right));background:color-mix(in oklab,var(--surface) 70%,transparent);border-top:1px solid var(--glass-border);backdrop-filter:blur(16px) saturate(1.35)}
    .nav-btn{border:1px solid var(--glass-border);background:var(--surface);border-radius:14px;min-height:44px;display:grid;gap:2px;place-items:center;cursor:pointer;box-shadow:0 1px 0 rgba(16,24,40,.03);transition:transform .06s,box-shadow .2s;font-size:12px;color:var(--muted)}
    .nav-btn:active{transform:scale(.98)}.nav-btn i{font-size:22px}

    .notice{display:none;text-align:center;color:var(--muted);border:1px dashed var(--glass-border);background:var(--surface);padding:18px;border-radius:var(--radius);backdrop-filter:blur(10px) saturate(1.2)}
    .spin{animation:spin 1.1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

    .delay{padding:2px 8px;border-radius:999px;border:1px solid var(--glass-border);font-size:12px}
    .delay-late{background:color-mix(in oklab,#ef4444 16%, var(--surface-2));border-color:color-mix(in oklab,#ef4444 45%, var(--glass-border))}
    .delay-early{background:color-mix(in oklab,#22c55e 16%, var(--surface-2));border-color:color-mix(in oklab,#22c55e 45%, var(--glass-border))}
    .delay-neutral{background:var(--surface-2)}
  </style>
</head>
<body>
  <div class="app">
    <header class="appbar" aria-label="Barra superior">
      <div class="brand">
        <div class="logo"><i class="material-icons">directions_transit</i></div>
        <div class="title"><strong>Gasteiz Lines</strong><span>Bus & Tranvía • en tiempo real</span></div>
      </div>
      <div class="actions">
        <button class="btn" id="themeToggle" aria-label="Cambiar tema"><i id="themeIcon" class="material-icons">dark_mode</i><span>Tema</span></button>
      </div>
    </header>

    <div id="offlineBanner" class="offline-banner">Sin conexión. Los datos pueden estar desactualizados.</div>

    <!-- Diagnóstico /api -->
    <div id="apiWarn" class="warn-banner"></div>

    <div id="empty-message" class="notice">No hay ninguna línea fijada todavía.<br>Añade tu primera línea de <strong>autobús</strong> o <strong>tranvía</strong>.</div>
    <main id="panels-container" class="grid" aria-live="polite"></main>
  </div>

  <nav class="bottom-nav" aria-label="Acciones">
    <button class="nav-btn" id="navAddBus"><i class="material-icons">directions_bus</i><span>Autobús</span></button>
    <button class="nav-btn" id="navAddTram"><i class="material-icons">tram</i><span>Tranvía</span></button>
    <button class="nav-btn" id="navRefresh"><i class="material-icons">refresh</i><span>Actualizar</span></button>
    <button class="nav-btn" id="navTheme"><i class="material-icons">contrast</i><span>Tema</span></button>
  </nav>

  <!-- Modal líneas -->
  <div id="lineModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="lineModalTitle">
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h3 id="lineModalTitle" style="margin:0">Selecciona una línea</h3>
        <button class="btn" id="closeLine"><i class="material-icons">close</i></button>
      </div>
      <input id="lineSearchInput" class="search" type="search"
             placeholder="Buscar línea…" inputmode="search" enterkeyhint="search"
             autocapitalize="none" autocomplete="off" spellcheck="false" />
      <ul id="lineList" class="list" role="listbox"></ul>
    </div>
  </div>

  <!-- Modal paradas -->
  <div id="stopsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="stopsModalTitle">
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h3 id="stopsModalTitle" style="margin:0">Selecciona una parada</h3>
        <div style="display:flex;gap:8px">
          <button class="btn" id="nearbyStopsBtn" title="Ordenar por cercanía"><i class="material-icons">my_location</i></button>
          <button class="btn" id="closeStops"><i class="material-icons">close</i></button>
        </div>
      </div>
      <input id="stopSearchInput" class="search" type="search"
             placeholder="Buscar parada…" inputmode="search" enterkeyhint="search"
             autocapitalize="none" autocomplete="off" spellcheck="false" />
      <div id="stopsListContainer" role="listbox"></div>
    </div>
  </div>

  <!-- Modal mapa -->
  <div id="mapModal" class="modal" role="dialog" aria-modal="true" aria-label="Mapa en vivo">
    <div id="mapWrap">
      <button class="map-close" id="closeMap">Cerrar mapa</button>
      <div id="map"></div>
    </div>
  </div>

  <script>
  /* ========= State ========= */
  let currentAddLineType = null, currentStopsForLine = null;
  const panels = {};
  let autoRefreshTimer = null;

  const ARRIVALS_TPL = "https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_PARADAS&idParada={stopId}&idRuta={lineCode}";

  const lines = [
    { code:"E1",  name:"Cementerio El Salvador", type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000017&idioma=ES" },
    { code:"G1",  name:"Lakua - Abetxuko",       type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000019&idioma=ES" },
    { code:"G2",  name:"Adurtza - Salburua",     type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000018&idioma=ES" },
    { code:"G3",  name:"Armentia - Zabalgana",   type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000015&idioma=ES" },
    { code:"G4",  name:"Sansomendi - Lakua",     type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000014&idioma=ES" },
    { code:"G6",  name:"Salburua - Aranbizkarra",type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000016&idioma=ES" },
    { code:"L1",  name:"Circular",               type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000004&idioma=ES" },
    { code:"L2A", name:"BEI A",                  type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000012&idioma=ES" },
    { code:"L2B", name:"BEI B",                  type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000013&idioma=ES" },
    { code:"L3",  name:"Betoño - Goikolarra",    type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000002&idioma=ES" },
    { code:"L4",  name:"Lakua - Mariturri",      type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000022&idioma=ES" },
    { code:"L5",  name:"Arkaiate - Elejalde",    type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000007&idioma=ES" },
    { code:"L5A", name:"Arkaiate - Astegieta",   type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000008&idioma=ES" },
    { code:"L5B", name:"Arkaiate - Ariñez",      type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000008&idioma=ES" },
    { code:"L5C", name:"Arkaiate - Júndiz-ITV",  type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000010&idioma=ES" },
    { code:"L5D", name:"Arkaiate - Ariñez-ITV",  type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000011&idioma=ES" },
    { code:"L6",  name:"Zabalgana - Arkaiate",   type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000006&idioma=ES" },
    { code:"L7",  name:"Borinbizkarra - Paz",    type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000005&idioma=ES" },
    { code:"L8",  name:"Unibertsitatea",         type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000001&idioma=ES" },
    { code:"L9",  name:"Gamarra - Goikolarra",   type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000000&idioma=ES" },
    { code:"L10", name:"Aldaia - Larrein",       type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000003&idioma=ES" },
    { code:"TG1", name:"Abetxuko-Unibertsitatea",type:"tram", stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000021&idioma=ES" },
    { code:"TG2", name:"Ibaiondo-Salburua",      type:"tram", stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000020&idioma=ES" }
  ];

  /* ============================================================
     Cloudflare Pages Functions proxy
     - Tu Function está en: functions/api/[[path]].js
     - Por tanto, desde el frontend se llama a: /api/...
     ============================================================ */
  const API_BASE = "/api";
  const API_TARGET_ORIGIN = "https://www.vitoria-gasteiz.org";

  function toProxiedUrl(input){
    // Permite pasar URLs absolutas del API original o URLs ya proxificadas (/api/..)
    const u = new URL(input, window.location.origin);

    // Si ya es /api/...
    if (u.origin === window.location.origin && u.pathname.startsWith(API_BASE + "/")){
      return u.pathname + u.search;
    }

    // Solo proxificamos el origen permitido
    if (u.origin !== API_TARGET_ORIGIN){
      throw new Error("URL no permitida para proxy: " + u.origin);
    }

    // /api + pathname + query
    return API_BASE + u.pathname + u.search;
  }

  async function getText(url){
    const proxied = toProxiedUrl(url);
    const res = await fetch(proxied, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + " en " + proxied);
    return await res.text();
  }

  function tryParseJSON(text){
    // 1) JSON puro
    try{ return JSON.parse(text); }catch(_){}

    // 2) JSON embebido (tu patrón original)
    const m = text.match(/\{[\s\S]*"(recorrido|llegadas|posiciones|color)"[\s\S]*\}/);
    if (m){
      try{ return JSON.parse(m[0]); }catch(_){}
    }

    // 3) Último intento: quitar HTML y parsear
    const stripped = text.replace(/<[^>]*>/g,'').trim();
    try{ return JSON.parse(stripped); }catch(_){}

    throw new Error("Respuesta no es JSON");
  }

  async function getJSON(url){
    const t = await getText(url);
    return tryParseJSON(t);
  }

  /* ========= Persistencia ========= */
  const getPinnedLines = () => { try { return JSON.parse(localStorage.getItem("pinned_lines") || "[]"); } catch { return [] } }
  const setPinnedLines = arr => localStorage.setItem("pinned_lines", JSON.stringify(arr));
  const setFavorite = (line, stop) => localStorage.setItem("favorite_"+line, JSON.stringify(stop));
  const getFavorite = (line) => { try { return JSON.parse(localStorage.getItem("favorite_"+line) || "null"); } catch { return null } }
  const removeFavorite = (line) => localStorage.removeItem("favorite_"+line);

  /* ========= UI utils ========= */
  const $ = (s, r=document)=>r.querySelector(s);
  const $$ = (s, r=document)=>Array.from(r.querySelectorAll(s));
  function updateEmpty(){ $("#empty-message").style.display = $("#panels-container").childElementCount ? 'none' : 'block'; }
  function bannerOffline(){ $("#offlineBanner").style.display = navigator.onLine ? 'none' : 'block'; }
  function animateTick(el){ if(!el) return; el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); }
  function parseHexColor(v){
    if(!v) return null;
    let s=String(v).trim().replace(/^#/,'');

    if(/^[0-9a-fA-F]{3}$/.test(s)) return '#'+s;
    if(/^[0-9a-fA-F]{6}$/.test(s)) return '#'+s;
    return null;
  }

  function fmtHHMM(secondsFromMidnight) {
    if (typeof secondsFromMidnight !== 'number') return '—';
    const h = Math.floor(secondsFromMidnight / 3600);
    const m = Math.floor((secondsFromMidnight % 3600) / 60);
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }
  function fmtETA(seconds, status) {
    if (status === 'STOPPED_AT' || seconds <= 0) return 'En la parada';
    if (seconds < 60) return `${seconds} s`;
    return `${Math.ceil(seconds / 60)} min`;
  }
  function delayInfo(item) {
    const rt = item?.realtimeArrival;
    const sch = item?.scheduledArrival;
    if (typeof rt !== 'number' || typeof sch !== 'number') return { label: null, cls: 'delay-neutral' };
    const diff = rt - sch; // s
    const abs = Math.abs(diff);
    if (abs <= 60) return { label: null, cls: 'delay-neutral' };
    const mins = Math.round(abs / 60);
    return diff > 60 ? { label: `+${mins}m`, cls: 'delay-late' } : { label: `–${mins}m`, cls: 'delay-early' };
  }

  /* ========= Diagnóstico de /api ========= */
  async function checkApiProxy(){
    const warn = $("#apiWarn");
    warn.style.display = "none";
    warn.textContent = "";

    // Si tu Function tiene /api/ping, lo usamos.
    // Si no lo tienes, igualmente detectamos HTML inesperado.
    try{
      const r = await fetch("/api/ping", { cache: "no-store" });
      const t = await r.text();

      // Si devuelve HTML, es casi seguro que la Function no está funcionando (fallback SPA)
      if (t.trim().startsWith("<!DOCTYPE html") || t.includes("<html")) {
        warn.style.display = "block";
        warn.innerHTML =
          `<strong>⚠️ El endpoint /api no está respondiendo como Function.</strong><br>
           Estás recibiendo HTML (probable fallback SPA). Revisa que Cloudflare Pages esté desplegando <code>functions/api/[[path]].js</code>
           y que ningún redirect tipo <code>/* → /index.html 200</code> esté capturando <code>/api/*</code>.`;
        return;
      }

      // Si es JSON, perfecto
      try{
        JSON.parse(t);
      }catch(_){
        // No es JSON: igualmente lo mostramos
        warn.style.display = "block";
        warn.innerHTML =
          `<strong>⚠️ /api/ping respondió pero no devolvió JSON.</strong><br>
           Respuesta: <code>${escapeHtml(t.slice(0,120))}</code>`;
      }
    }catch(e){
      // Si /api/ping no existe, no lo consideramos fatal.
      // Pero avisamos si hay fallo total.
      warn.style.display = "block";
      warn.innerHTML =
        `<strong>⚠️ No se pudo comprobar /api/ping.</strong><br>
         Esto no es necesariamente un error si no tienes implementado el ping en la Function, pero si la app no carga,
         prueba abrir <code>/api/j16-02w/detalleAction.do?id=2000000000&idioma=ES</code> y comprueba que no devuelve tu index.html.`;
    }
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function togglePin(code){
    let p = getPinnedLines();
    p = p.includes(code) ? p.filter(x=>x!==code) : [...p, code];
    setPinnedLines(p);
    updatePinIcon(code);
    localStorage.setItem('last_open_map_line', code);
  }
  function updatePinIcon(code){
    const btn = $("#pin-btn-"+code); if (!btn) return;
    const active = getPinnedLines().includes(code);
    btn.classList.toggle('is-pinned', active);
    btn.setAttribute('aria-pressed', String(active));
  }
  function toggleFavorite(code){
    const p = panels[code]; if(!p) return;
    const fav = getFavorite(code);
    if (fav && fav.id===p.currentStopId) removeFavorite(code);
    else setFavorite(code, {id:p.currentStopId, name:p.currentStopName});
    updateFavIcon(code);
  }
  function updateFavIcon(code){
    const p = panels[code]; if(!p) return;
    const fav = getFavorite(code);
    const selected = fav && fav.id === p.currentStopId;
    $("#fav-btn-"+code)?.classList.toggle('selected', selected);
    const ic = $("#fav-icon-"+code); if (ic) ic.textContent = selected ? "★" : "☆";
  }

  /* ========= Paradas ========= */
  async function loadStopsForPanel(code){
    const panel = panels[code]; if(!panel) return;
    const line = panel.line;
    try{
      const data = await getJSON(line.stopsUrl);
      if (!data || !Array.isArray(data.recorrido)) throw new Error('Respuesta sin recorrido');

      if (line.type==='bus' && data.color){
        const col = parseHexColor(data.color);
        if (col){ $("#panel-"+code).style.setProperty('--line-accent', col); }
      }

      const fav = getFavorite(line.code);
      if (fav){ panel.currentStopId=fav.id; panel.currentStopName=fav.name; }
      else { const s=data.recorrido[0]; panel.currentStopId=s.idParada; panel.currentStopName=s.nombre; }

      $("#stop-name-"+code).textContent = panel.currentStopName || "Parada no disponible";
      refreshPanel(code);
      updateFavIcon(code);
    }catch(err){
      console.warn('Paradas -', line.code, err);
      $("#stop-name-"+code).textContent = "Error al cargar las paradas";
      $("#info-"+code).innerHTML = `<span class="danger">⚠️ No se pudieron cargar las paradas.</span>`;
      $("#list-"+code).innerHTML = "";
    }
  }

  /* ======== Modales ======== */
  function lockBodyScroll(){ document.body.classList.add('modal-open'); }
  function unlockBodyScroll(){ document.body.classList.remove('modal-open'); }

  function attachViewportShim(modal){
    const vv = window.visualViewport; if(!vv) return;
    const sheet = modal.querySelector('.sheet');
    const onResize = ()=>{
      const overlap = Math.max(0, (window.innerHeight - vv.height - vv.offsetTop));
      sheet.style.paddingBottom = (14 + overlap) + 'px';
    };
    vv.addEventListener('resize', onResize);
    vv.addEventListener('scroll', onResize);
    onResize();
    modal._vvDetach = ()=>{ vv.removeEventListener('resize', onResize); vv.removeEventListener('scroll', onResize); sheet.style.paddingBottom=''; };
  }
  function detachViewportShim(modal){ if(modal && modal._vvDetach){ modal._vvDetach(); modal._vvDetach=null; } }

  async function showStopsList(code){
    currentStopsForLine = code;
    const panel = panels[code]; if(!panel) return;

    const picker = $("#stop-picker-"+code);
    picker?.setAttribute('aria-expanded','true');

    $("#stopsListContainer").innerHTML =

    lockBodyScroll();
    attachViewportShim($("#stopsModal"));
    setTimeout(()=>{ $("#stopSearchInput")?.focus({preventScroll:true}); }, 50);

    try{
      const data = await getJSON(panel.line.stopsUrl);
      if (!data || !Array.isArray(data.recorrido)) throw new Error('Respuesta sin recorrido');
      const cont = $("#stopsListContainer"); cont.innerHTML="";
      data.recorrido.forEach(st=>{
        const div = document.createElement('div');

        div.textContent = st.nombre;
        cont.appendChild(div);
      });
      cont.onclick = (e)=>{

        selectStop(it.dataset.id, it.textContent);
      };
    }catch(err){
      $("#stopsListContainer").innerHTML = `<div class="danger" style="padding:12px">⚠️ No se pudieron cargar las paradas. Inténtalo de nuevo.</div>`;
      console.warn('Stops modal error', err);

  function closeStops(){
    const modal = $("#stopsModal");
    modal.classList.remove('open');
    detachViewportShim(modal);
    unlockBodyScroll();
    const code = currentStopsForLine;
    if (code) $("#stop-picker-"+code)?.setAttribute('aria-expanded','false');

  function selectStop(stopId, name){
    const code = currentStopsForLine; if(!code || !panels[code]) return;
    const p = panels[code]; p.currentStopId = stopId; p.currentStopName = name;
    $("#stop-name-"+code).textContent = name;
    closeStops(); refreshPanel(code); updateFavIcon(code);
  }

  /* ========= Llegadas ========= */
  async function refreshPanel(code){
    const p = panels[code]; if(!p || !p.currentStopId) return;
    const { line } = p;
    const info = $("#info-"+code), list = $("#list-"+code);

    if (p.countdownInterval){ clearInterval(p.countdownInterval); p.countdownInterval=null; }
    Object.values(p.countdownIntervals||{}).forEach(id=>clearInterval(id));
    p.countdownIntervals = {};

    // OJO: ARRIVALS_TPL es URL ABSOLUTA (vitoria-gasteiz.org),
    // pero getJSON/getText la proxifican a /api/... automáticamente.
    if (line.type==='tram'){
      const url = ARRIVALS_TPL.replace("{stopId}", p.currentStopId).replace("{lineCode}", line.code);
      try{
        const data = await getJSON(url);
        const arr = (data.llegadas||[]).filter(x=>x.line===line.code);
        if (!arr.length){ info.textContent="🚊 No hay más llegadas hoy."; list.innerHTML=""; return; }

        const groups = {};
        arr.forEach(a=>{ (groups[a.destination||"Destino"] ??= []).push(a); });
        Object.values(groups).forEach(g=>g.sort((a,b)=>a.seconds-b.seconds));

        let html='';
        for(const dest in groups){
          const g = groups[dest], nx=g[0];
          const etaText = fmtETA(nx.seconds, nx.status);
          const urgent = (nx.seconds < 60 || nx.status === 'INCOMING_AT') ? ' is-urgent' : '';
          const hour = typeof nx.realtimeArrival === 'number' ? fmtHHMM(nx.realtimeArrival)
                      : (typeof nx.scheduledArrival === 'number' ? `≈${fmtHHMM(nx.scheduledArrival)}` : '—');
          const dly = delayInfo(nx);

          const nextChips = g.slice(1).map(a=>{
            const h = typeof a.realtimeArrival === 'number' ? fmtHHMM(a.realtimeArrival)
                    : (typeof a.scheduledArrival === 'number' ? `≈${fmtHHMM(a.scheduledArrival)}` : '—');
            const mins = a.seconds < 60 ? `${a.seconds} s` : `${Math.ceil(a.seconds/60)} min`;
            const dd = delayInfo(a);
            return `<div class="badge">
              <div class="time"><strong>${h}</strong></div>
              <div class="left">en ${mins} ${dd.label ? `• <span class="delay ${dd.cls}">${dd.label}</span>` : ''}</div>
            </div>`;
          }).join('');

          const mainETA = nx.seconds < 60 ? `<span id="${code}-${dest.replace(/\s+/g,'_')}-cd">${nx.seconds}</span> s` : etaText;

          html += `
            <div class="tram-group">
              <div class="tram-dest">Destino: ${dest}</div>
              <div class="tram-next">
                <div class="tram-count${urgent}">${mainETA}</div>
                <div class="hint">
                  <span>Hora prevista: <strong>${hour}</strong></span>
                  ${dly.label ? `<span class="delay ${dly.cls}">${dly.label}</span>` : ''}
                </div>
              </div>
              <div class="badges">${nextChips}</div>
            </div>`;

          if (nx.seconds < 60){
            const id = `${code}-${dest.replace(/\s+/g,'_')}-cd`;
            p.countdownIntervals[dest] = setInterval(()=>{
              const el=document.getElementById(id); if(!el) return;
              let n=parseInt(el.textContent,10);
              if(Number.isFinite(n)&&n>0){ el.textContent=n-1; }
              else { el.textContent="0"; clearInterval(p.countdownIntervals[dest]); }
            },1000);
          }
        }
        info.innerHTML = `<div class="tram-stack">${html}</div>`; list.innerHTML="";
      }catch(e){
        info.innerHTML = `<span class="danger">⚠️ Error al obtener la información.</span>`; list.innerHTML="";
        console.warn('Arrivals tram error', e);
      }
    } else {
      const expected = (line.code.startsWith('L') && !['L2A','L2B'].includes(line.code)) ? line.code.substring(1) : line.code;
      const url = ARRIVALS_TPL.replace("{stopId}", p.currentStopId).replace("{lineCode}", expected);
      try{
        const data = await getJSON(url);
        const arr = (data.llegadas||[]).filter(x=>x.line===expected);
        if (!arr.length){ info.textContent="🚍 No hay más llegadas hoy."; list.innerHTML=""; return; }

        const nx = arr[0];
        const etaText = fmtETA(nx.seconds, nx.status);
        const urgentClass = (nx.seconds < 60 || nx.status === 'INCOMING_AT') ? ' is-urgent' : '';
        const hour = typeof nx.realtimeArrival === 'number' ? fmtHHMM(nx.realtimeArrival)
                    : (typeof nx.scheduledArrival === 'number' ? `≈${fmtHHMM(nx.scheduledArrival)}` : '—');
        const dly = delayInfo(nx);

        info.innerHTML = `
          <div class="next-time ${urgentClass}" id="count-${code}">${etaText}</div>
          <div class="hint">
            <span>Hora prevista: <strong>${hour}</strong></span>
            ${dly.label ? `<span class="delay ${dly.cls}">${dly.label}</span>` : ''}
          </div>
        `;

        const cdEl = $("#count-"+code);
        if (nx.seconds < 60){
          cdEl.innerHTML = `<span id="sec-${code}">${nx.seconds}</span> s`;
          p.countdownInterval = setInterval(()=>{
            const el = $("#sec-"+code); if(!el) return;
            let n = parseInt(el.textContent,10);
            if(Number.isFinite(n)&&n>0){ el.textContent = n-1; }
            else { el.textContent="0"; clearInterval(p.countdownInterval); p.countdownInterval=null; }
          }, 1000);
        }

        list.innerHTML = arr.slice(1,6).map(l=>{
          const h = typeof l.realtimeArrival === 'number' ? fmtHHMM(l.realtimeArrival)
                  : (typeof l.scheduledArrival === 'number' ? `≈${fmtHHMM(l.scheduledArrival)}` : '—');
          const left = l.seconds < 60 ? `${l.seconds} s` : `${Math.ceil(l.seconds/60)} min`;
          const dl = delayInfo(l);
          return `<div class="badge">
            <div class="time"><strong>${h}</strong></div>
            <div class="left">en ${left} ${dl.label ? `• <span class="delay ${dl.cls}">${dl.label}</span>` : ''}</div>
          </div>`;
        }).join('');
        animateTick($("#panel-"+code+" .next-time"));
      }catch(e){
        info.innerHTML = `<span class="danger">⚠️ Error al obtener la información.</span>`; list.innerHTML="";
        console.warn('Arrivals bus error', e);
      }
    }
  }

  /* ========= Mapas ========= */
  let map, busMapInterval=null, busMarkers={}, stopMarkers={};
  function initMap(){ map = new google.maps.Map(document.getElementById("map"), { center:{lat:42.846,lng:-2.671}, zoom:14, mapTypeControl:false, streetViewControl:false, fullscreenControl:false }); }
  async function openMap(code){
    $("#mapModal").classList.add('open'); lockBodyScroll();
    initMap();
    try{
      await Promise.all([updateStopMarkers(code), updateVehiclePositions(code)]);
      if (busMapInterval) clearInterval(busMapInterval);
      busMapInterval = setInterval(()=>updateVehiclePositions(code),5000);
      localStorage.setItem('last_open_map_line', code);
    }catch(_){}
  }
  function closeMap(){
    $("#mapModal").classList.remove('open'); unlockBodyScroll();
    if(busMapInterval){clearInterval(busMapInterval); busMapInterval=null;}
    Object.values(busMarkers).forEach(m=>m.setMap(null)); busMarkers={};
    Object.values(stopMarkers).forEach(m=>m.setMap(null)); stopMarkers={};
  }

  // IMPORTANTE: también proxificamos positions (antes era URL directa)
  async function updateVehiclePositions(code){
    try{
      const url = `https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_RUTA&idRuta=${encodeURIComponent(code)}&type=positions`;
      const data = await getJSON(url);
      (data.posiciones||[]).forEach(pos=>{
        const veh=pos.vehiculo, lat=parseFloat(pos.latitud), lng=parseFloat(pos.longitud);
        if(!Number.isFinite(lat)||!Number.isFinite(lng)) return;
        const latLng={lat,lng};
        if (busMarkers[veh]) busMarkers[veh].setPosition(latLng);
        else busMarkers[veh]=new google.maps.Marker({position:latLng,map,title:`Vehículo ${veh}`,icon:{url:"https://maps.google.com/mapfiles/ms/icons/green-dot.png"}});
      });
    }catch(e){ console.warn('Positions error', e); }
  }

  async function updateStopMarkers(code){
    try{
      const line = lines.find(l=>l.code===code); if(!line) return;
      const data = await getJSON(line.stopsUrl);
      (data.recorrido||[]).forEach(s=>{
        const lat=parseFloat(s.latitud), lng=parseFloat(s.longitud);
        if(!Number.isFinite(lat)||!Number.isFinite(lng)) return;
        const id=s.idParada;
        if (stopMarkers[id]) stopMarkers[id].setPosition({lat,lng});
        else stopMarkers[id]=new google.maps.Marker({position:{lat,lng},map,title:s.nombre,icon:{url:"https://maps.google.com/mapfiles/ms/icons/blue-dot.png"}});
      });
    }catch(e){ console.warn('Stops markers error', e); }
  }

  /* ========= App: borrar/refresh/pinned ========= */
  function deletePanel(code){ $("#panel-"+code)?.remove(); delete panels[code]; const p=getPinnedLines(); if (p.includes(code)) setPinnedLines(p.filter(x=>x!==code)); updateEmpty(); }
  function refreshAll(){ Object.keys(panels).forEach(refreshPanel); }
  function loadPinned(){ getPinnedLines().forEach(code=>{ const line=lines.find(l=>l.code===code); if(line) createPanel(line); }); updateEmpty(); }
  function startAuto(){ if(autoRefreshTimer) clearInterval(autoRefreshTimer); autoRefreshTimer=setInterval(()=>{ refreshAll(); },30000); }

  /* ========= Tema ========= */
  function pref(){ return localStorage.getItem('theme_pref')||'auto'; }
  function sysDark(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function applyTheme(p){ document.documentElement.classList.add('theme-switching'); const t=p==='auto'?(sysDark()?'dark':'light'):p; document.documentElement.setAttribute('data-theme',t); $("#themeIcon").textContent=t==='dark'?'light_mode':'dark_mode'; const c=t==='dark'?'#0b1220':'#f6f8fc'; $('#metaThemeLight').setAttribute('content',c); $('#metaThemeDark').setAttribute('content',c); setTimeout(()=>document.documentElement.classList.remove('theme-switching'),250); }
  function cycleTheme(){ const c=pref(); const n=c==='auto'?'light':c==='light'?'dark':'auto'; localStorage.setItem('theme_pref',n); applyTheme(n); }

  /* ========= UI eventos ========= */
  document.addEventListener('DOMContentLoaded', ()=>{
    $("#navAddBus").addEventListener('click', ()=>openAddLineModal('bus'));
    $("#navAddTram").addEventListener('click', ()=>openAddLineModal('tram'));

    $("#navRefresh").addEventListener('click', ()=>{
      const ic=$("#navRefresh i");
      ic.classList.add('spin');
      refreshAll();
      setTimeout(()=>ic.classList.remove('spin'), 900);
    });

    $("#navTheme").addEventListener('click', cycleTheme);
    $("#themeToggle").addEventListener('click', cycleTheme);

    $("#closeLine").addEventListener('click', ()=>{ $("#lineModal").classList.remove('open'); unlockBodyScroll(); detachViewportShim($("#lineModal")); });
    $("#closeStops").addEventListener('click', closeStops);
    $("#closeMap").addEventListener('click', closeMap);
    $("#lineModal").addEventListener('click', e=>{ if(e.target===e.currentTarget){ $("#lineModal").classList.remove('open'); unlockBodyScroll(); detachViewportShim($("#lineModal")); } });
    $("#stopsModal").addEventListener('click', e=>{ if(e.target===e.currentTarget) closeStops(); });
    $("#mapModal").addEventListener('click', e=>{ if(e.target===e.currentTarget) closeMap(); });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ $("#lineModal").classList.remove('open'); unlockBodyScroll(); detachViewportShim($("#lineModal")); closeStops(); closeMap(); } });

    $("#lineSearchInput").addEventListener('input', function(){ const q=this.value.toLowerCase(); $$("#lineList li").forEach(li=>{ li.style.display=li.textContent.toLowerCase().includes(q)?"": "none"; }); });
    $("#stopSearchInput").addEventListener('input', function(){ const q=this.value.toLowerCase(); $$("#stopsListContainer .stop-item").forEach(it=>{ it.style.display=it.textContent.toLowerCase().includes(q)?"":"none"; }); });

    $("#nearbyStopsBtn").addEventListener('click', ()=>{
      if (!navigator.geolocation) return alert("La geolocalización no está disponible.");
      navigator.geolocation.getCurrentPosition(pos=>{
        const {latitude,longitude}=pos.coords;
        const items=$$("#stopsListContainer .stop-item");
        const arr=items.map(el=>{
          const lat=parseFloat(el.dataset.lat), lng=parseFloat(el.dataset.lng);
          const d=(Number.isFinite(lat)&&Number.isFinite(lng))?haversine(latitude,longitude,lat,lng):Number.POSITIVE_INFINITY;
          return {el,d};
        }).sort((a,b)=>a.d-b.d);
        const cont=$("#stopsListContainer"); cont.innerHTML=""; arr.forEach(x=>cont.appendChild(x.el));
      }, _=>alert("No se pudo obtener tu ubicación."));
    });

    window.addEventListener('online', bannerOffline);
    window.addEventListener('offline', bannerOffline);
    bannerOffline();
    applyTheme(pref());
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(pref()==='auto') applyTheme('auto'); });

    // 1) Diagnóstico /api
    checkApiProxy();

    // 2) Cargar paneles
    loadPinned();
    startAuto();
  });

  function openAddLineModal(type){
    const list = lines.filter(l=>l.type===type && !panels[l.code]).sort((a,b)=>a.code.localeCompare(b.code));
    $("#lineList").innerHTML = list.length
      ? list.map(l=>`<li role="option" tabindex="0" data-code="${l.code}">${l.code} — ${l.name}</li>`).join('')
      : '<li role="option" tabindex="0" aria-disabled="true">No quedan líneas disponibles.</li>';
    $("#lineModalTitle").textContent = list.length ? `Seleccione una línea de ${type==='bus'?'autobús':'tranvía'}` : "No quedan líneas disponibles para agregar.";
    $("#lineSearchInput").value=""; $("#lineModal").classList.add('open'); lockBodyScroll(); attachViewportShim($("#lineModal"));
    setTimeout(()=>{ $("#lineSearchInput")?.focus({preventScroll:true}); }, 50);

    $("#lineList").onclick = (e)=>{ const li=e.target.closest('li'); if(!li || li.getAttribute('aria-disabled')==='true') return; const code=li.dataset.code; const line=lines.find(x=>x.code===code); if(line) { createPanel(line); $("#lineModal").classList.remove('open'); unlockBodyScroll(); detachViewportShim($("#lineModal")); } };
    $("#lineList").onkeydown = (e)=>{ if(e.key==='Enter'){ const li=e.target.closest('li'); if(li && li.getAttribute('aria-disabled')!=='true'){ const code=li.dataset.code; const line=lines.find(x=>x.code===code); if(line){ createPanel(line); $("#lineModal").classList.remove('open'); unlockBodyScroll(); detachViewportShim($("#lineModal")); } } } };
  }
  window.openAddLineModal = openAddLineModal;

  function haversine(lat1, lon1, lat2, lon2){
    const R=6371000, toRad=d=>d*Math.PI/180;
    const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
    const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
  }
  </script>
