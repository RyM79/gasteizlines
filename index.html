<!DOCTYPE html>
<html lang="es" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gasteiz Lines — Bus & Tranvía</title>

  <meta id="metaThemeLight" name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)">
  <meta id="metaThemeDark"  name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f8fc;
      --bg-accent:radial-gradient(1200px 520px at 50% -10%,color-mix(in oklab,var(--primary) 14%,transparent) 0%,transparent 60%);
      --surface:rgba(255,255,255,.72);
      --surface-2:rgba(246,248,252,.80);
      --glass-border:rgba(15,23,42,.08);
      --text:#0f172a;
      --muted:#5b6b82;
      --primary:#0b63ff;
      --accent-bus:#22c55e;
      --accent-tram:#e11d48;
      --danger:#ef4444;
      --radius:18px;
      --shadow:0 12px 40px rgba(16,24,40,.12);
      --ring:0 0 0 3px rgba(11,99,255,.25);
      color-scheme:light;
    }
    html[data-theme=dark]{
      --bg:#0b1220;
      --bg-accent:radial-gradient(1200px 520px at 50% -10%,color-mix(in oklab,var(--primary) 22%,transparent) 0%,transparent 60%);
      --surface:rgba(17,24,39,.62);
      --surface-2:rgba(15,23,42,.60);
      --glass-border:rgba(255,255,255,.085);
      --text:#e5e7eb;
      --muted:#a8b6c7;
      --primary:#3b82f6;
      --danger:#f87171;
      --shadow:0 18px 52px rgba(0,0,0,.45);
      --ring:0 0 0 3px rgba(59,130,246,.25);
      color-scheme:dark;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
      background:var(--bg-accent),var(--bg);
      color:var(--text);
      -webkit-tap-highlight-color:transparent;
    }
    body.modal-open{overflow:hidden;height:100%}
    html.theme-switching *{transition:background-color .25s,color .25s,border-color .25s,box-shadow .25s}

    .app{max-width:1080px;margin:0 auto;padding:16px clamp(12px,4vw,24px) 104px;display:grid;gap:14px}

    header.appbar{
      position:sticky;top:0;z-index:50;
      display:grid;grid-template-columns: 1fr auto;
      gap:12px;align-items:center;
      padding:14px clamp(12px,4vw,24px);
      margin:-16px calc(clamp(12px,4vw,24px)*-1) 0;
      background:color-mix(in oklab,var(--surface) 72%,transparent);
      backdrop-filter:blur(16px) saturate(1.4);
      border-bottom:1px solid var(--glass-border);
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{
      width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;
      background:linear-gradient(135deg,var(--primary) 0%,#22c55e 100%);
      box-shadow:0 10px 24px color-mix(in oklab,var(--primary) 30%,transparent)
    }
    .title{display:grid;line-height:1.05;min-width:0}
    .title strong{font-size:18px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .title .sub{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:2px}
    .title .sub span{font-size:12px;color:var(--muted)}
    .pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:4px 10px;border-radius:999px;
      border:1px solid var(--glass-border);
      background:var(--surface-2);
      font-size:12px;color:var(--muted);
    }
    .dot{width:6px;height:6px;border-radius:50%;background:color-mix(in oklab,var(--muted) 55%,transparent);display:inline-block}

    .actions{display:flex;gap:10px;align-items:center}
    .btn{
      display:inline-flex;align-items:center;gap:8px;
      min-height:40px;padding:10px 12px;border-radius:14px;
      border:1px solid var(--glass-border);background:var(--surface);
      cursor:pointer;box-shadow:0 1px 0 rgba(16,24,40,.03);
      transition:transform .06s,box-shadow .2s
    }
    .btn i{font-size:20px}
    .btn span{font-size:12px;color:var(--muted)}
    .btn:active{transform:scale(.98)}
    @media (hover:hover) and (pointer:fine){
      .btn:hover,.pin-btn:hover,.del-btn:hover,.nav-btn:hover,.chip:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
    }

    .offline-banner{
      position:sticky;top:0;z-index:49;margin:0 -16px;padding:10px 16px;
      background:#fee2e2;color:#991b1b;border-bottom:1px solid #fecaca;display:none;font-size:13px
    }
    html[data-theme=dark] .offline-banner{background:#3f1d1d;color:#fecaca;border-color:#7f1d1d}

    .grid{display:grid;gap:14px}
    .card{
      position:relative;
      border:1px solid var(--glass-border);
      background:var(--surface);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
      display:grid;
      gap:12px;
      overflow:clip;
      backdrop-filter:blur(14px) saturate(1.25);
      touch-action: pan-y;
      user-select:none;
    }
    .card::after{content:"";position:absolute;inset:-1px -1px auto -1px;height:6px;border-radius:18px 18px 0 0;background:var(--line-accent,var(--primary));opacity:.92;pointer-events:none}

    .card-top{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
    .line-row{display:flex;align-items:center;gap:10px;min-width:0}
    .line-pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:4px 10px;border-radius:999px;font-weight:900;letter-spacing:.2px;font-size:12px;
      background: color-mix(in oklab, var(--line-accent) 18%, var(--surface));
      border:1px solid color-mix(in oklab, var(--line-accent) 45%, var(--glass-border));
      color: var(--text); white-space:nowrap;
    }
    .line-pill i{font-size:16px;color:color-mix(in oklab, var(--line-accent) 80%, var(--text));}
    .line-name{font-weight:950;letter-spacing:-.25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;min-width:0}

    .meta-small{
      margin-top:2px;
      font-size:12px;color:var(--muted);
      display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    }

    .card-actions{display:flex;gap:10px;align-items:center}
    .pin-btn, .del-btn{
      width:42px;height:42px;
      display:grid;place-items:center;
      border-radius:12px;
      border:1px solid var(--glass-border);
      background:var(--surface);
      cursor:pointer;
      transition:transform .06s,box-shadow .2s, background .2s, border-color .2s;
    }
    .pin-btn i, .del-btn i{font-size:20px;color:var(--muted)}
    .pin-btn:active,.del-btn:active{transform:scale(.98)}
    .pin-btn.pinned{
      border-color:color-mix(in oklab,var(--line-accent) 45%, var(--glass-border));
      background:color-mix(in oklab,var(--line-accent) 14%, var(--surface));
    }
    .pin-btn.pinned i{color:color-mix(in oklab,var(--line-accent) 80%, var(--text))}
    .del-btn{
      border-color:color-mix(in oklab,var(--danger) 35%, var(--glass-border));
      background:color-mix(in oklab,var(--danger) 8%, var(--surface));
    }
    .del-btn i{color:color-mix(in oklab,var(--danger) 70%, var(--muted))}

    .stop-row{
      display:grid;
      grid-template-columns:1fr auto;
      align-items:center;
      gap:10px;
      padding:12px;
      border-radius:14px;
      border:1px solid var(--glass-border);
      background:var(--surface-2);
    }
    .stop-picker{
      display:flex;align-items:center;gap:8px;width:100%;
      background:none;border:none;padding:0;text-align:left;
      cursor:pointer;color:inherit;
      min-height:44px;
      border-radius:12px;
    }
    .stop-picker i{font-size:18px;color:var(--primary)}
    .stop-picker:focus-visible{outline:none;box-shadow:var(--ring)}
    .stop-name{font-weight:950;letter-spacing:-.2px;font-size:16.5px;}
    .caret{margin-left:auto;color:var(--muted);transition: transform .2s ease, color .2s ease;}
    .stop-picker:hover .caret{ color: var(--primary); }
    .stop-picker[aria-expanded="true"] .caret{ transform: rotate(180deg); }

    .fav{
      background:none;border:none;cursor:pointer;color:var(--primary);
      min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:12px;
      font-size:26px;
    }
    .fav.selected{color:#f59e0b}
    .fav:focus-visible{outline:none;box-shadow:var(--ring)}

    /* ALERTAS */
    .alerts{
      position:relative;
      display:none;
      border:1px solid color-mix(in oklab,#f59e0b 40%, var(--glass-border));
      background:color-mix(in oklab,#f59e0b 14%, var(--surface));
      border-radius:14px;
      padding:10px 12px;
      padding-right:52px; /* espacio para la X */
      gap:10px;
      align-items:flex-start;
    }
    .alerts.show{display:flex}
    .alerts i{font-size:18px;color:color-mix(in oklab,#f59e0b 75%, var(--text));margin-top:1px}
    .alerts .alert-text{
      font-size:13px;
      color:color-mix(in oklab,var(--text) 92%, #0000);
      line-height:1.25;
      min-width:0;
    }
    .alerts .alert-text strong{font-weight:950}
    html[data-theme=dark] .alerts{
      background:color-mix(in oklab,#f59e0b 18%, var(--surface));
      border-color:color-mix(in oklab,#f59e0b 34%, var(--glass-border));
    }

    .alerts-close{
      position:absolute;
      top:10px;
      right:10px;
      width:34px;height:34px;
      border-radius:12px;
      border:1px solid color-mix(in oklab,#f59e0b 35%, var(--glass-border));
      background:color-mix(in oklab,var(--surface) 88%, transparent);
      color:var(--muted);
      display:grid;
      place-items:center;
      cursor:pointer;
    }
    .alerts-close i{ font-size:18px; }
    .alerts-close:active{ transform:scale(.98); }
    .alerts-close:focus-visible{ outline:none; box-shadow: var(--ring); }

    /* Horario resaltado en avisos */
    .alert-meta{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid color-mix(in oklab,#f59e0b 45%, var(--glass-border));
      background: color-mix(in oklab,#f59e0b 18%, var(--surface));
      color: color-mix(in oklab,var(--text) 92%, #0000);
      font-weight:950;
      font-size:12px;
      margin-bottom:6px;
    }
    .alert-meta i{
      font-size:16px;
      color: color-mix(in oklab,#f59e0b 80%, var(--text));
    }

    .stack{display:grid;gap:10px;justify-items:center;text-align:center}
    .next-time{
      font-size:clamp(44px,9vw,72px);
      font-weight:950;
      letter-spacing:-1px;
      line-height:.95;
      font-variant-numeric:tabular-nums;
    }
    .hint{
      color:var(--muted);
      font-size:12px;
      display:flex;gap:8px;flex-wrap:wrap;
      justify-content:center;align-items:center;
    }

    /* Próximas compactas (máximo 2) */
    .next-compact{
      width:100%;
      max-width:520px;
      display:none;
      gap:8px;
      flex-wrap:wrap;
      justify-content:center;
    }
    .next-compact.show{display:flex}
    .next-chip{
      display:inline-flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--glass-border);
      background:var(--surface-2);
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
    }
    .next-chip .big{font-weight:950;font-size:15px;line-height:1}
    .next-chip .sub{color:var(--muted);font-weight:850;font-size:12px;line-height:1.15}

    /* bloque compacto por destino (tranvía) */
    .dest-block{
      width:100%;
      max-width:540px;
      border:1px solid var(--glass-border);
      background:color-mix(in oklab,var(--surface-2) 85%, transparent);
      border-radius:16px;
      padding:12px;
      display:grid;
      gap:10px;
      text-align:center;
    }
    .dest-head{
      display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
      color:var(--muted);font-weight:900;font-size:12px;
    }

    /* ✅ DESTINO resaltado */
    .dest-pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:6px 12px;border-radius:999px;
      border:1px solid color-mix(in oklab, var(--line-accent) 45%, var(--glass-border));
      background: color-mix(in oklab, var(--line-accent) 12%, var(--surface));
      color: var(--text);
      font-weight:950;
      box-shadow:0 8px 18px rgba(16,24,40,.08);
    }
    .dest-pill i{
      font-size:18px;
      color: color-mix(in oklab, var(--line-accent) 85%, var(--text));
    }
    
    /* ✅ DIRECCIÓN (tranvía): estilo neutro */
    .dest-pill.dir-pill{
      border-color: color-mix(in oklab, var(--primary) 40%, var(--glass-border));
      background: color-mix(in oklab, var(--primary) 10%, var(--surface));
      box-shadow:0 8px 18px rgba(16,24,40,.08);
    }
    .dest-pill.dir-pill i{
      color: color-mix(in oklab, var(--primary) 80%, var(--text));
    }
    .dest-label{
      font-size:11px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color: var(--muted);
      font-weight:950;
    }
    .dest-value{
      font-size:14px;
      font-weight:950;
      color: var(--text);
    }

    .delay{padding:2px 8px;border-radius:999px;border:1px solid var(--glass-border);font-size:12px}
    .delay-late{background:color-mix(in oklab,#ef4444 16%, var(--surface-2));border-color:color-mix(in oklab,#ef4444 45%, var(--glass-border))}
    .delay-early{background:color-mix(in oklab,#22c55e 16%, var(--surface-2));border-color:color-mix(in oklab,#22c55e 45%, var(--glass-border))}
    .delay-neutral{background:var(--surface-2)}

    .notice{
      display:none;text-align:center;color:var(--muted);
      border:1px dashed var(--glass-border);
      background:var(--surface);
      padding:18px;border-radius:var(--radius);
      backdrop-filter:blur(10px) saturate(1.2)
    }

    .bottom-nav{
      position:fixed;left:0;right:0;bottom:0;z-index:55;
      display:grid;grid-template-columns:repeat(2,1fr);
      gap:10px;align-items:center;
      padding:12px max(12px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right));
      background:color-mix(in oklab,var(--surface) 72%,transparent);
      border-top:1px solid var(--glass-border);
      backdrop-filter:blur(16px) saturate(1.35)
    }
    .nav-btn{
      border:1px solid var(--glass-border);
      background:var(--surface);
      border-radius:18px;
      min-height:52px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      cursor:pointer;
      box-shadow:0 2px 0 rgba(16,24,40,.03);
      transition:transform .06s,box-shadow .2s;
      font-size:13px;color:var(--muted);
      font-weight:900;
      letter-spacing:.1px;
    }
    .nav-btn i{font-size:22px}
    .nav-btn.primary{
      background:linear-gradient(135deg,
        color-mix(in oklab,var(--primary) 78%, #ffffff 0%) 0%,
        color-mix(in oklab,var(--primary) 58%, #22c55e 0%) 120%);
      border-color:color-mix(in oklab,var(--primary) 48%, var(--glass-border));
      color:#fff;
      text-shadow:0 1px 0 rgba(0,0,0,.18);
      box-shadow:0 16px 34px color-mix(in oklab,var(--primary) 18%, transparent);
    }
    .nav-btn.secondary{
      background:color-mix(in oklab,var(--surface) 92%, transparent);
      border-color:color-mix(in oklab,var(--glass-border) 80%, transparent);
      color:var(--text);
    }
    .nav-btn:active{transform:scale(.985)}
    .spin{animation:spin 1.1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .modal{position:fixed;inset:0;display:none;place-items:center;padding:16px;z-index:60;background:rgba(0,0,0,.35);overscroll-behavior:contain}
    .modal.open{display:grid}
    .sheet{
      width:min(760px,96vw);
      max-height:88vh;
      overflow:auto;
      background:var(--surface);
      border:1px solid var(--glass-border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px;
      backdrop-filter:blur(12px) saturate(1.25);
      animation:pop .15s ease;
    }
    @keyframes pop{from{transform:translateY(6px);opacity:0}}

    #addModal .sheet{
      height: min(78vh, 640px);
      max-height: 88vh;
      display:flex;
      flex-direction:column;
    }
    #stopsModal .sheet{display:flex;flex-direction:column}

    #stopsListContainer, #addList{
      flex:1;
      min-height:0;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
      overflow-anchor:none;
    }

    #addList{
      border:1px solid var(--glass-border);
      background:var(--surface-2);
      border-radius:16px;
      padding:6px 0;
    }

    .search{
      width:100%;
      border:1px solid var(--glass-border);
      background:var(--surface);
      color:var(--text);
      padding:12px;border-radius:14px;
      margin:10px 0 10px;
      font: inherit;
    }
    @media (max-width: 600px){
      .search{ font-size:17px; line-height:1.25; }
    }

    .chips{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
    .chip{
      border:1px solid var(--glass-border);
      background:var(--surface-2);
      color:var(--muted);
      padding:8px 10px;border-radius:999px;
      cursor:pointer;
      font-size:12px;font-weight:950;
      transition:transform .06s, background .2s, color .2s;
      min-height:36px;
    }
    .chip.active{
      background:color-mix(in oklab,var(--primary) 18%, var(--surface));
      color:var(--text);
      border-color:color-mix(in oklab,var(--primary) 42%, var(--glass-border));
    }

    .add-item,.stop-item{
      padding:12px;border-bottom:1px solid var(--glass-border);
      cursor:pointer;
      display:flex;gap:10px;align-items:center;
    }
    .add-item:hover,.stop-item:hover{background:color-mix(in oklab,var(--surface) 90%,transparent)}
    .stop-item.selected{background:color-mix(in oklab,var(--surface) 86%,transparent)}
    .row-main{min-width:0}
    .row-title{font-weight:950;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row-right{margin-left:auto;color:var(--muted);font-size:12px;font-weight:950;display:flex;align-items:center;gap:8px}
    .section-title{
      font-size:12px;color:var(--muted);
      font-weight:950;letter-spacing:.2px;
      margin:10px 4px 6px;
      display:flex;align-items:center;gap:8px;
    }
    .divider{height:1px;background:var(--glass-border);margin:10px 0}

    /* ===== Timeline popup (siguientes paradas) ===== */
    .count-btn{
      appearance:none;
      border:none;
      background:none;
      padding:0;
      margin:0;
      cursor:pointer;
      color:inherit;
      border-radius:16px;
      position:relative;
      display:inline-block;
    }
    .count-btn:focus-visible{ outline:none; box-shadow:var(--ring); }
    .count-btn .next-time{ transition: transform .06s; }
    .count-btn:active .next-time{ transform: scale(.99); }

    /* Botón "timeline" integrado sin ocupar espacio */
    .count-btn::after{
      content:"timeline";
      font-family:"Material Icons";
      position:absolute;
      top:-10px;
      right:-10px;
      width:30px;
      height:30px;
      border-radius:999px;
      display:grid;
      place-items:center;
      font-size:18px;
      border:1px solid var(--glass-border);
      background:var(--surface);
      color:color-mix(in oklab,var(--primary) 70%, var(--muted));
      box-shadow:0 10px 24px rgba(16,24,40,.10);
      opacity:.75;
      transition:opacity .18s ease, transform .06s ease;
      pointer-events:none; /* el click es el del contador */
    }
    @media (hover:hover) and (pointer:fine){
      .count-btn::after{ opacity:.55; }
      .count-btn:hover::after{ opacity:1; }
    }
    .count-btn:active::after{ transform:scale(.98); }

    #timelineModal .sheet{ width:min(760px,96vw); }
    .timeline-sub{
      margin:6px 0 0;
      display:flex;gap:8px;flex-wrap:wrap;align-items:center;
      color:var(--muted);font-size:12px;font-weight:900;
    }
    .timeline-sub .pill{ background:var(--surface-2); }
    .timeline{
      margin-top:12px;
      display:grid;
      gap:10px;
    }
    .tl-item{
      display:grid;
      grid-template-columns:18px 1fr auto;
      gap:10px;
      align-items:flex-start;
      padding:12px;
      border-radius:16px;
      border:1px solid var(--glass-border);
      background:var(--surface-2);
    }
    .tl-rail{
      position:relative;
      width:18px;
      display:flex;
      justify-content:center;
    }
    .tl-rail::before{
      content:"";
      position:absolute;
      top:10px;bottom:10px;
      width:2px;
      border-radius:999px;
      background:color-mix(in oklab,var(--line-accent) 42%, var(--glass-border));
      opacity:.95;
    }
    .tl-dot{
      width:10px;height:10px;border-radius:50%;
      background:var(--line-accent);
      margin-top:6px;
      box-shadow:0 0 0 5px color-mix(in oklab,var(--line-accent) 14%, transparent);
      z-index:1;
    }
    .tl-item.current .tl-dot{
      background:var(--primary);
      box-shadow:0 0 0 5px rgba(11,99,255,.18);
    }
    .tl-main{ min-width:0; }
    .tl-stop{
      font-weight:950;
      letter-spacing:-.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .tl-meta{
      margin-top:2px;
      color:var(--muted);
      font-size:12px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .tl-time{
      font-variant-numeric:tabular-nums;
      font-weight:950;
      padding:7px 10px;
      border-radius:999px;
      border:1px solid var(--glass-border);
      background:var(--surface);
      color:var(--text);
      white-space:nowrap;
      align-self:center;
    }
    .tl-time.muted{ color:var(--muted); }
    .tl-time.soon{
      border-color: color-mix(in oklab,var(--primary) 42%, var(--glass-border));
      background: color-mix(in oklab,var(--primary) 10%, var(--surface));
    }
    .tl-empty{
      padding:14px;
      border-radius:16px;
      border:1px dashed var(--glass-border);
      background:var(--surface);
      color:var(--muted);
      text-align:center;
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="appbar" aria-label="Barra superior">
      <div class="brand">
        <div class="logo"><i class="material-icons">directions_transit</i></div>
        <div class="title">
          <strong>Gasteiz Lines</strong>
          <div class="sub">
            <span>Bus & Tranvía</span>
            <span class="dot"></span>
            <span id="globalUpdated" class="pill">Actualizado: —</span>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="themeToggle" aria-label="Cambiar tema">
          <i id="themeIcon" class="material-icons">dark_mode</i><span>Tema</span>
        </button>
      </div>
    </header>

    <div id="offlineBanner" class="offline-banner">Sin conexión. Los datos pueden estar desactualizados.</div>

    <div id="empty-message" class="notice">
      No has añadido ninguna línea todavía.<br>
      Pulsa <strong>+ Añadir</strong> para empezar.
    </div>

    <main id="panels-container" class="grid" aria-live="polite"></main>
  </div>

  <nav class="bottom-nav" aria-label="Acciones">
    <button class="nav-btn primary" id="navAdd"><i class="material-icons">add</i><span>Añadir</span></button>
    <button class="nav-btn secondary" id="navRefresh"><i class="material-icons">refresh</i><span>Actualizar</span></button>
  </nav>

  <!-- Modal añadir línea -->
  <div id="addModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h3 id="addModalTitle" style="margin:0">Añadir línea</h3>
        <button class="btn" id="closeAdd"><i class="material-icons">close</i></button>
      </div>

      <input id="addSearchInput" class="search" type="search"
             placeholder="Buscar por código o nombre…" inputmode="search" enterkeyhint="search"
             autocapitalize="none" autocomplete="off" spellcheck="false" />

      <div class="chips" aria-label="Filtros">
        <button class="chip active" id="chipAll" type="button">Todas</button>
        <button class="chip" id="chipBus" type="button">Bus</button>
        <button class="chip" id="chipTram" type="button">Tranvía</button>
      </div>

      <div id="addList" role="listbox"></div>
    </div>
  </div>

  <!-- Modal paradas -->
  <div id="stopsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="stopsModalTitle">
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h3 id="stopsModalTitle" style="margin:0">Selecciona una parada</h3>
        <div style="display:flex;gap:8px">
          <button class="btn" id="nearbyStopsBtn" title="Ordenar por cercanía"><i class="material-icons">my_location</i></button>
          <button class="btn" id="closeStops"><i class="material-icons">close</i></button>
        </div>
      </div>

      <input id="stopSearchInput" class="search" type="search"
             placeholder="Buscar parada…" inputmode="search" enterkeyhint="search"
             autocapitalize="none" autocomplete="off" spellcheck="false" />

      <div id="stopsListContainer" role="listbox"></div>
    </div>
  </div>

  <!-- Modal timeline (siguientes paradas) -->
  <div id="timelineModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="timelineModalTitle">
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div style="min-width:0">
          <h3 id="timelineModalTitle" style="margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Siguientes paradas</h3>
          <div id="timelineModalSub" class="timeline-sub"></div>
        </div>
        <button class="btn" id="closeTimeline" aria-label="Cerrar">
          <i class="material-icons">close</i>
        </button>
      </div>

      <div id="timelineBody" class="timeline" aria-live="polite"></div>
    </div>
  </div>

  <script>
  /* ========= State ========= */
  let currentStopsForInstance = null;
  let addFilter = "all";
  const panels = {};
  let autoRefreshTimer = null;
  let globalLastRefresh = 0;
  let globalTickTimer = null;

  const colorCache = loadJSON("line_colors", {});
  const inflightColor = new Set();

  const ARRIVALS_TPL = "https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?accion=CONSULTA_PARADAS&idParada={stopId}&idRuta={lineCode}";

  const lines = [
    { code:"E1",  name:"Cementerio El Salvador", type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000017&idioma=ES" },
    { code:"G1",  name:"Lakua - Abetxuko",       type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000019&idioma=ES" },
    { code:"G2",  name:"Adurtza - Salburua",     type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000018&idioma=ES" },
    { code:"G3",  name:"Armentia - Zabalgana",   type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000015&idioma=ES" },
    { code:"G4",  name:"Sansomendi - Lakua",     type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000014&idioma=ES" },
    { code:"G6",  name:"Salburua - Aranbizkarra",type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000016&idioma=ES" },
    { code:"L1",  name:"Circular",               type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000004&idioma=ES" },
    { code:"L2A", name:"BEI A",                  type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000012&idioma=ES" },
    { code:"L2B", name:"BEI B",                  type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000013&idioma=ES" },
    { code:"L3",  name:"Betoño - Goikolarra",    type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000002&idioma=ES" },
    { code:"L4",  name:"Lakua - Mariturri",      type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000022&idioma=ES" },
    { code:"L5",  name:"Arkaiate - Elejalde",    type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000007&idioma=ES" },
    { code:"L5A", name:"Arkaiate - Astegieta",   type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000008&idioma=ES" },
    { code:"L5B", name:"Arkaiate - Ariñez",      type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000008&idioma=ES" },
    { code:"L5C", name:"Arkaiate - Júndiz-ITV",  type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000010&idioma=ES" },
    { code:"L5D", name:"Arkaiate - Ariñez-ITV",  type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000011&idioma=ES" },
    { code:"L6",  name:"Zabalgana - Arkaiate",   type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000006&idioma=ES" },
    { code:"L7",  name:"Borinbizkarra - Paz",    type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000005&idioma=ES" },
    { code:"L8",  name:"Unibertsitatea",         type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000001&idioma=ES" },
    { code:"L9",  name:"Gamarra - Goikolarra",   type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000000&idioma=ES" },
    { code:"L10", name:"Aldaia - Larrein",       type:"bus",  stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000003&idioma=ES" },
    { code:"TG1", name:"Abetxuko-Unibertsitatea",type:"tram", stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000021&idioma=ES" },
    { code:"TG2", name:"Ibaiondo-Salburua",      type:"tram", stopsUrl:"https://www.vitoria-gasteiz.org/j16-02w/detalleAction.do?id=2000000020&idioma=ES" }
  ];

  /* ==== Cloudflare Pages Functions proxy: /api/* ==== */
  const API_BASE = "/api";
  const API_TARGET_ORIGIN = "https://www.vitoria-gasteiz.org";

  function toProxiedUrl(input){
    const u = new URL(input, window.location.origin);
    if (u.origin === window.location.origin && u.pathname.startsWith(API_BASE + "/")){
      return u.pathname + u.search;
    }
    if (u.origin !== API_TARGET_ORIGIN){
      throw new Error("URL no permitida para proxy: " + u.origin);
    }
    return API_BASE + u.pathname + u.search;
  }

  async function getText(url){
    const toFetch = toProxiedUrl(url);
    const res = await fetch(toFetch, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + " en " + toFetch);
    return await res.text();
  }

  function tryParseJSON(text){
    try{ return JSON.parse(text); }catch(_){}
    const m = text.match(/\{[\s\S]*"(recorrido|llegadas|posiciones|color|alertas)"[\s\S]*\}/);
    if (m){ try{ return JSON.parse(m[0]); }catch(_){ } }
    const stripped = text.replace(/<[^>]*>/g,'').trim();
    try{ return JSON.parse(stripped); }catch(_){}
    throw new Error("Respuesta no es JSON");
  }

  async function getJSON(url){
    const t = await getText(url);
    return tryParseJSON(t);
  }

  /* ========= Storage ========= */
  function loadJSON(key, fallback){
    try{
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    }catch{ return fallback; }
  }
  function saveJSON(key, value){
    localStorage.setItem(key, JSON.stringify(value));
  }

  function uid(){
    return (crypto?.randomUUID ? crypto.randomUUID() : ("id-"+Date.now()+"-"+Math.random().toString(16).slice(2))).slice(0,18);
  }

  const getPinned = () => loadJSON("pinned_instances", []);
  const setPinned = (arr) => saveJSON("pinned_instances", arr);
  const isPinned = (instanceId) => getPinned().includes(instanceId);

  function setPinnedInstance(instanceId, pinned){
    let p = getPinned();
    const has = p.includes(instanceId);
    if (pinned && !has) p = [...p, instanceId];
    if (!pinned && has) p = p.filter(x=>x!==instanceId);
    setPinned(p);
    updatePinUI(instanceId);
    renderPanelsOrder();
    persistAllPanels();
  }
  function togglePin(instanceId){ setPinnedInstance(instanceId, !isPinned(instanceId)); }

  const favKey = (instanceId)=>"favorite_"+instanceId;
  const setFavorite = (instanceId, stop) => saveJSON(favKey(instanceId), stop);
  const getFavorite = (instanceId) => loadJSON(favKey(instanceId), null);
  const removeFavorite = (instanceId) => localStorage.removeItem(favKey(instanceId));

  const recKey = (lineCode) => "recent_" + lineCode;
  function getRecents(lineCode){ return loadJSON(recKey(lineCode), []); }
  function pushRecent(lineCode, stop){
    if (!stop?.id || !stop?.name) return;
    let r = getRecents(lineCode).filter(x => x.id !== stop.id);
    r.unshift(stop);
    r = r.slice(0, 6);
    saveJSON(recKey(lineCode), r);
  }

  /* ========= UI ========= */
  const $ = (s, r=document)=>r.querySelector(s);
  const $$ = (s, r=document)=>Array.from(r.querySelectorAll(s));

  function updateEmpty(){
    $("#empty-message").style.display = Object.keys(panels).length ? "none" : "block";
  }

  function parseHexColor(v){
    if(!v) return null;
    let s=String(v).trim().replace(/^#/,'');
    if(/^[0-9a-fA-F]{3}$/.test(s)) return '#'+s;
    if(/^[0-9a-fA-F]{6}$/.test(s)) return '#'+s;
    return null;
  }

  function fmtHHMM(secondsFromMidnight) {
    if (typeof secondsFromMidnight !== 'number') return '—';
    const h = Math.floor(secondsFromMidnight / 3600);
    const m = Math.floor((secondsFromMidnight % 3600) / 60);
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }

  function fmtETA(seconds, status) {
    if (status === 'STOPPED_AT' || seconds <= 0) return 'En la parada';
    if (seconds < 60) return `${seconds} s`;
    return `${Math.ceil(seconds / 60)} min`;
  }

  function fmtEtaOrClock(seconds, status, hourText){
    if (typeof seconds === "number" && seconds >= 60*60 && hourText && hourText !== '—'){
      return hourText;
    }
    return fmtETA(seconds, status);
  }

  function delayInfo(item) {
    const rt = item?.realtimeArrival;
    const sch = item?.scheduledArrival;
    if (typeof rt !== 'number' || typeof sch !== 'number') return { label: null, cls: 'delay-neutral' };
    const diff = rt - sch;
    const abs = Math.abs(diff);
    if (abs <= 60) return { label: null, cls: 'delay-neutral' };
    const mins = Math.round(abs / 60);
    return diff > 60 ? { label: `+${mins}m`, cls: 'delay-late' } : { label: `–${mins}m`, cls: 'delay-early' };
  }

  function relTime(ts){
    if (!ts) return "—";
    const s = Math.max(0, Math.floor((Date.now() - ts)/1000));
    if (s < 5) return "ahora";
    if (s < 60) return `hace ${s}s`;
    const m = Math.floor(s/60);
    if (m < 60) return `hace ${m}m`;
    const h = Math.floor(m/60);
    return `hace ${h}h`;
  }

  function updateGlobalUpdated(){
    $("#globalUpdated").textContent = `Actualizado: ${relTime(globalLastRefresh)}`;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ========= Modal helpers ========= */
  function lockBodyScroll(){ document.body.classList.add('modal-open'); }
  function unlockBodyScroll(){ document.body.classList.remove('modal-open'); }

  function attachViewportShim(modal){
    const vv = window.visualViewport; if(!vv) return;
    const sheet = modal.querySelector('.sheet');
    const onResize = ()=>{
      const overlap = Math.max(0, (window.innerHeight - vv.height - vv.offsetTop));
      sheet.style.paddingBottom = (14 + overlap) + 'px';
    };
    vv.addEventListener('resize', onResize);
    vv.addEventListener('scroll', onResize);
    onResize();
    modal._vvDetach = ()=>{ vv.removeEventListener('resize', onResize); vv.removeEventListener('scroll', onResize); sheet.style.paddingBottom=''; };
  }
  function detachViewportShim(modal){ if(modal && modal._vvDetach){ modal._vvDetach(); modal._vvDetach=null; } }

  /* ========= Colors ========= */
  async function ensureLineColor(line){
    if (line.type !== "bus") return;
    if (colorCache[line.code]) return;
    if (inflightColor.has(line.code)) return;
    inflightColor.add(line.code);
    try{
      const data = await getJSON(line.stopsUrl);
      const col = parseHexColor(data?.color);
      if (col){
        colorCache[line.code] = col;
        saveJSON("line_colors", colorCache);
        $$(".add-item").forEach(it=>{
          if (it.dataset.code === line.code){
            it.style.setProperty("--chip-accent", col);
          }
        });
        Object.keys(panels).forEach(id=>{
          const p = panels[id];
          if (p?.line?.code === line.code){
            $("#panel-"+id)?.style.setProperty("--line-accent", col);
          }
        });
      }
    }catch(_){} finally{ inflightColor.delete(line.code); }
  }

  /* ========= Order ========= */
  function renderPanelsOrder(){
    const container = $("#panels-container");
    const allIds = Object.keys(panels);
    const pinned = getPinned();

    const ordered = [
      ...pinned.filter(id => allIds.includes(id)),
      ...allIds.filter(id => !pinned.includes(id)).sort((a,b)=>{
        const la = panels[a]?.line?.code || a;
        const lb = panels[b]?.line?.code || b;
        return la.localeCompare(lb);
      })
    ];

    ordered.forEach(id=>{
      const el = $("#panel-"+id);
      if (el) container.appendChild(el);
    });
  }

  /* ========= Favorites ========= */
  function toggleFavorite(instanceId){
    const p = panels[instanceId]; if(!p) return;
    const fav = getFavorite(instanceId);
    if (fav && fav.id===p.currentStopId) removeFavorite(instanceId);
    else setFavorite(instanceId, {id:p.currentStopId, name:p.currentStopName});
    updateFavIcon(instanceId);
    persistAllPanels();
  }
  function updateFavIcon(instanceId){
    const p = panels[instanceId]; if(!p) return;
    const fav = getFavorite(instanceId);
    const selected = fav && fav.id === p.currentStopId;
    $("#fav-btn-"+instanceId)?.classList.toggle('selected', selected);
    const ic = $("#fav-icon-"+instanceId);
    if (ic) ic.textContent = selected ? "★" : "☆";
  }

  /* ========= Delete ========= */
  function deletePanel(instanceId){
    const p = panels[instanceId];
    if (p?.countdownInterval) clearInterval(p.countdownInterval);
    delete panels[instanceId];
    $("#panel-"+instanceId)?.remove();

    const pins = getPinned();
    if (pins.includes(instanceId)) setPinned(pins.filter(x=>x!==instanceId));

    renderPanelsOrder();
    updateEmpty();
    persistAllPanels();
  }

  /* ========= Create panel ========= */
  function updatePinUI(instanceId){
    const pinned = isPinned(instanceId);
    const btn = $("#pin-btn-"+instanceId);
    if (btn){
      btn.classList.toggle("pinned", pinned);
      btn.setAttribute("aria-pressed", String(pinned));
      btn.title = pinned ? "Desfijar" : "Fijar";
    }
  }

  function setStatus(instanceId, text){
    const el = $("#status-"+instanceId);
    if (el) el.textContent = "Estado: " + text;
  }
  function setUpdated(instanceId, ts){
    const el = $("#updated-"+instanceId);
    if (el) el.textContent = "Actualizado: " + relTime(ts);
  }

  function renderStoppedText(instanceId, targetEl){
    const p = panels[instanceId];
    const icon = p?.line?.type === "tram" ? "tram" : "directions_bus";
    const el = targetEl || $("#count-"+instanceId);
    if (!el) return;
    el.innerHTML = `<span style="display:inline-flex;align-items:center;gap:10px">
      <i class="material-icons" aria-hidden="true" style="font-size:.85em;opacity:.9">${icon}</i>
      <span>En la parada</span>
    </span>`;
  }

  function tramAlertLineNumber(code){
    if (code === "TG1") return "1";
    if (code === "TG2") return "2";
    return code.replace(/\D+/g,'') || code;
  }

  function filterAlertsForPanel(panel, alerts){
    const arr = Array.isArray(alerts) ? alerts : [];
    if (!arr.length) return [];

    const stopId = String(panel.currentStopId || "");
    const isTram = panel.line.type === "tram";
    const lineMatch = isTram ? tramAlertLineNumber(panel.line.code) : panel.line.code;
    const lineType = isTram ? "3" : null;

    return arr.filter(a=>{
      const aStop = String(a.stopId ?? "*");
      if (!(aStop === "*" || aStop === stopId)) return false;

      const aLine = String(a.line ?? "*");
      if (!(aLine === "*" || aLine === lineMatch)) return false;

      if (lineType && a.lineType != null && String(a.lineType) !== String(lineType)) return false;

      return true;
    });
  }

  function fmtAlertWindow(a){
    const start = Number(a?.alertPeriodStart);
    const end = Number(a?.alertPeriodEnd);
    if (!Number.isFinite(start) || !Number.isFinite(end)) return "";

    const s = new Date(start * 1000);
    const e = new Date(end * 1000);

    const hhmm = d => `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

    const today = new Date();
    const day0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const dayS = new Date(s.getFullYear(), s.getMonth(), s.getDate());
    const dayE = new Date(e.getFullYear(), e.getMonth(), e.getDate());

    const dayLabel = (d)=>{
      const diffDays = Math.round((d - day0) / (24*3600*1000));
      if (diffDays === 0) return "Hoy";
      if (diffDays === 1) return "Mañana";
      return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
    };

    if (dayS.getTime() !== dayE.getTime()){
      return `${dayLabel(dayS)} ${hhmm(s)} → ${dayLabel(dayE)} ${hhmm(e)}`;
    }
    return `${dayLabel(dayS)} ${hhmm(s)}–${hhmm(e)}`;
  }

  function setAlerts(instanceId, alertsRaw){
    const box = $("#alerts-"+instanceId);
    if (!box) return;

    const panel = panels[instanceId];
    const stopId = String(panel?.currentStopId || "");

    const dismissKey = `alerts_dismiss_${instanceId}_${stopId}`;
    if (sessionStorage.getItem(dismissKey) === "1") {
      box.classList.remove("show");
      box.innerHTML = `<i class="material-icons" aria-hidden="true">warning_amber</i>`;
      return;
    }

    const relevant = filterAlertsForPanel(panel, alertsRaw);

    if (!relevant.length){
      box.classList.remove("show");
      box.innerHTML = `<i class="material-icons" aria-hidden="true">warning_amber</i>`;
      return;
    }

    relevant.sort((a,b)=>{
      const as = String(a.stopId) !== "*" ? 0 : 1;
      const bs = String(b.stopId) !== "*" ? 0 : 1;
      if (as !== bs) return as - bs;

      const sa = Number(a.alertPeriodStart);
      const sb = Number(b.alertPeriodStart);
      if (Number.isFinite(sa) && Number.isFinite(sb)) return sa - sb;

      return (Number(b.realtime) - Number(a.realtime));
    });

    const top = relevant.slice(0, 2);

    const items = top.map(a=>{
      const head = a.alertHeader || "Aviso";
      const desc = a.alertDescription || "";
      const win = fmtAlertWindow(a);

      return `
        <div style="margin-top:8px">
          ${win ? `
            <div class="alert-meta">
              <i class="material-icons" aria-hidden="true">schedule</i>
              <span>${escapeHtml(win)}</span>
            </div>
            <br>
          ` : ``}

          <strong>${escapeHtml(head)}</strong><br>
          ${desc ? `<span>${escapeHtml(desc)}</span><br>` : ``}
        </div>
      `;
    }).join("");

    box.innerHTML = `
      <button class="alerts-close" type="button" title="Ocultar avisos" aria-label="Ocultar avisos">
        <i class="material-icons" aria-hidden="true">close</i>
      </button>

      <i class="material-icons" aria-hidden="true">warning_amber</i>
      <div class="alert-text">
        <strong>Avisos</strong>
        ${items}
      </div>
    `;
    box.classList.add("show");

    const btn = box.querySelector(".alerts-close");
    btn?.addEventListener("click", (e)=>{
      e.preventDefault();
      sessionStorage.setItem(dismissKey, "1");
      box.classList.remove("show");
      box.innerHTML = `<i class="material-icons" aria-hidden="true">warning_amber</i>`;
    }, { once:true });
  }

  function renderNextChipsHtml(items){
    return items.map(it=>{
      return `
        <div class="next-chip">
          <span class="big">${escapeHtml(it.bigText)}</span>
          <span class="sub">Hora: ${escapeHtml(it.hourText)}</span>
          ${it.delayLabel ? `<span class="delay ${it.delayCls}">${escapeHtml(it.delayLabel)}</span>` : ``}
        </div>
      `;
    }).join("");
  }

  function renderDestinationBlock(instanceId, destName, nx, restArr){
    const isTram = panels[instanceId].line.type === "tram";

    const hour = typeof nx.realtimeArrival === 'number' ? fmtHHMM(nx.realtimeArrival)
                : (typeof nx.scheduledArrival === 'number' ? `≈${fmtHHMM(nx.scheduledArrival)}` : '—');

    const secVal = (nx && nx.seconds != null) ? Number(nx.seconds) : NaN;

    const etaBig = fmtEtaOrClock(Number.isFinite(secVal) ? secVal : nx.seconds, nx.status, hour);
    const dly = delayInfo(nx);
    const etaSmall = Number.isFinite(secVal)
      ? (secVal < 60 ? `en ${secVal}s` : `en ${Math.ceil(secVal/60)} min`)
      : '';

    const chips = restArr.slice(0,2).map(a=>{
      const h = typeof a.realtimeArrival === 'number' ? fmtHHMM(a.realtimeArrival)
              : (typeof a.scheduledArrival === 'number' ? `≈${fmtHHMM(a.scheduledArrival)}` : '—');
      const aSec = (a && a.seconds != null) ? Number(a.seconds) : NaN;
      const eta = Number.isFinite(aSec) ? (aSec < 60 ? `en ${aSec} s` : `en ${Math.ceil(aSec/60)} min`) : '';
      const dl = delayInfo(a);
      return { hourText: h, bigText: eta || "—", delayLabel: dl.label, delayCls: dl.cls };
    });

    return `
      <div class="dest-block">
        <div class="dest-head">
          <span class="dest-pill ${isTram ? 'dir-pill' : ''}">
            <i class="material-icons" aria-hidden="true">${isTram?'tram':'directions_bus'}</i>
            <span class="dest-label">${isTram ? 'Dirección' : 'Destino'}</span>
            <span class="dest-value">${escapeHtml(destName)}</span>
          </span>
        </div>

        <div>
          <button class="count-btn" type="button" data-action="timeline" data-dest="${escapeHtml(destName)}" aria-label="Ver llegada en siguientes paradas">
            <div class="next-time">${
              (Number.isFinite(secVal) && secVal < 60)
                ? `<span class="tram-sec" data-seconds="${secVal}">${secVal}</span> s`
                : `${escapeHtml(etaBig)}`
            }</div>
          </button>

          <div class="hint">
            <span>Hora: <strong>${escapeHtml(hour)}</strong></span>
            ${etaBig === hour && etaSmall ? `<span class="pill" style="padding:3px 10px">${escapeHtml(etaSmall)}</span>` : ''}
            ${dly.label ? `<span class="delay ${dly.cls}">${escapeHtml(dly.label)}</span>` : ''}
          </div>
        </div>

        <div class="next-compact ${chips.length?'show':''}" style="max-width:520px;margin:0 auto;justify-content:center">
          ${chips.length ? renderNextChipsHtml(chips) : ``}
        </div>
      </div>
    `;
  }

    };

    $("#stop-picker-"+instanceId).addEventListener('click', ()=> showStopsList(instanceId));
    $("#fav-btn-"+instanceId).addEventListener('click', ()=> toggleFavorite(instanceId));
    $("#pin-btn-"+instanceId).addEventListener('click', ()=> togglePin(instanceId));

  async function loadStopsForPanel(instanceId){
    const panel = panels[instanceId]; if(!panel) return;
    const line = panel.line;

    try{
      setStatus(instanceId, "Cargando paradas…");
      const data = await getJSON(line.stopsUrl);
      if (!data || !Array.isArray(data.recorrido)) throw new Error('Respuesta sin recorrido');

      // Cache de paradas para timeline
      panel.stops = data.recorrido;

      if (line.type==='bus' && data.color){
        const col = parseHexColor(data.color);
        if (col){
          $("#panel-"+instanceId).style.setProperty('--line-accent', col);
          if (!colorCache[line.code]){
            colorCache[line.code] = col;
            saveJSON("line_colors", colorCache);
          }
          updatePinUI(instanceId);
        }
      }

      const fav = getFavorite(instanceId);
      if (fav){
        panel.currentStopId=fav.id; panel.currentStopName=fav.name;
      } else {
        const s=data.recorrido[0];
        panel.currentStopId=s.idParada;
        panel.currentStopName=s.nombre;
      }

      $("#stop-name-"+instanceId).textContent = panel.currentStopName || "Parada no disponible";
      updateFavIcon(instanceId);

      await refreshPanel(instanceId);
    }catch(err){
      $("#stop-name-"+instanceId).textContent = "Error al cargar paradas";
      $("#info-"+instanceId).innerHTML = `<div class="next-time">—</div><div class="hint">⚠️ No se pudieron cargar las paradas.</div>`;
      $("#next-"+instanceId).classList.remove("show");
      $("#next-"+instanceId).innerHTML = "";
      setAlerts(instanceId, []);
      setStatus(instanceId, "Error");
      console.warn('Paradas -', line.code, err);
    }
  }

  function getRouteCode(line){
    const isTram = line.type === "tram";
    return isTram
      ? line.code
      : ((line.code.startsWith('L') && !['L2A','L2B'].includes(line.code)) ? line.code.substring(1) : line.code);
  }

  async function refreshPanel(instanceId){
    const p = panels[instanceId]; if(!p || !p.currentStopId) return;
    const { line } = p;

    if (p.countdownInterval){ clearInterval(p.countdownInterval); p.countdownInterval=null; }

    if (p.tramCountdownIntervals && p.tramCountdownIntervals.length){
      p.tramCountdownIntervals.forEach(id=>clearInterval(id));
      p.tramCountdownIntervals = [];
    }

    setStatus(instanceId, "Actualizando…");
    const started = Date.now();

    try{
      const isTram = line.type === "tram";
      const routeCode = getRouteCode(line);

      const url = ARRIVALS_TPL.replace("{stopId}", p.currentStopId).replace("{lineCode}", routeCode);
      const data = await getJSON(url);

      setAlerts(instanceId, data?.alertas || []);

      let arr = (data.llegadas||[]);
      if (isTram) arr = arr.filter(x=>x.line===line.code);
      else arr = arr.filter(x=>x.line===routeCode);

      // Cache para timeline
      p.lastArrivals = arr;
      p.lastArrivalsAtStop = { stopId: p.currentStopId, at: started };

      if (!arr.length){
        $("#info-"+instanceId).innerHTML = `<div class="next-time">—</div><div class="hint">${isTram ? "🚊" : "🚍"} No hay más llegadas hoy.</div>`;
        $("#next-"+instanceId).classList.remove("show");
        $("#next-"+instanceId).innerHTML = "";
        setStatus(instanceId, "Sin llegadas");
        p.lastUpdated = started; setUpdated(instanceId, started);
        return;
      }

      if (isTram){
        const groups = {};
        arr.forEach(a=>{
          const k = (a.destination || "Destino").toString();
          (groups[k] ??= []).push(a);
        });
        Object.values(groups).forEach(g=>g.sort((a,b)=>a.seconds-b.seconds));

        const dests = Object.keys(groups).sort((a,b)=>groups[a][0].seconds - groups[b][0].seconds);
        const firstTwo = dests.slice(0,2);

        const blocksHtml = firstTwo.map(dest=>{
          const g = groups[dest];
          const nx = g[0];
          const rest = g.slice(1);
          return renderDestinationBlock(instanceId, dest, nx, rest);
        }).join("");

        $("#info-"+instanceId).innerHTML = blocksHtml;
        $("#next-"+instanceId).classList.remove("show");
        $("#next-"+instanceId).innerHTML = "";

        // Countdown por bloque (tranvía)
        p.tramCountdownIntervals = [];
        const panelEl = $("#panel-"+instanceId);
        const spans = panelEl ? panelEl.querySelectorAll(".tram-sec[data-seconds]") : [];
        spans.forEach(span=>{
          const intervalId = setInterval(()=>{
            if (!document.body.contains(span)){
              clearInterval(intervalId);
              return;
            }
            let n = parseInt(span.dataset.seconds, 10);
            if (!Number.isFinite(n)){
              clearInterval(intervalId);
              return;
            }
            n = n - 1;
            if (n <= 0){
              clearInterval(intervalId);
              const nextTimeEl = span.closest(".next-time");
              if (nextTimeEl) renderStoppedText(instanceId, nextTimeEl);
              return;
            }
            span.dataset.seconds = String(n);
            span.textContent = String(n);
          }, 1000);

          p.tramCountdownIntervals.push(intervalId);
        });

        setStatus(instanceId, "OK");
        p.lastUpdated = started; setUpdated(instanceId, started);
        return;
      }

      const nx = arr[0];
      const hour = typeof nx.realtimeArrival === 'number' ? fmtHHMM(nx.realtimeArrival)
                  : (typeof nx.scheduledArrival === 'number' ? `≈${fmtHHMM(nx.scheduledArrival)}` : '—');

      const etaBig = fmtEtaOrClock(nx.seconds, nx.status, hour);
      const dly = delayInfo(nx);
      const etaSmall = (typeof nx.seconds === 'number')
        ? (nx.seconds < 60 ? `en ${nx.seconds}s` : `en ${Math.ceil(nx.seconds/60)} min`)
        : '';

      $("#info-"+instanceId).innerHTML = `
        <button class="count-btn" type="button" data-action="timeline" aria-label="Ver llegada en siguientes paradas">
          <div class="next-time" id="count-${instanceId}">${escapeHtml(etaBig)}</div>
        </button>
        <div class="hint">
          <span>Hora: <strong>${escapeHtml(hour)}</strong></span>
          ${etaBig === hour && etaSmall ? `<span class="pill" style="padding:3px 10px">${escapeHtml(etaSmall)}</span>` : ''}
          ${dly.label ? `<span class="delay ${dly.cls}">${escapeHtml(dly.label)}</span>` : ''}
        </div>
      `;

      const cdEl = $("#count-"+instanceId);
      if (typeof nx.seconds === "number" && nx.seconds < 60){
        cdEl.innerHTML = `<span id="sec-${instanceId}">${nx.seconds}</span> s`;
        p.countdownInterval = setInterval(()=>{
          const el = $("#sec-"+instanceId);
          if(!el){ clearInterval(p.countdownInterval); p.countdownInterval=null; return; }
          let n = parseInt(el.textContent,10);
          if(!Number.isFinite(n)){ clearInterval(p.countdownInterval); p.countdownInterval=null; return; }
          if (n <= 1){
            clearInterval(p.countdownInterval); p.countdownInterval=null;
            renderStoppedText(instanceId);
            return;
          }
          el.textContent = String(n-1);
        }, 1000);
      } else if (nx.status === 'STOPPED_AT' || nx.seconds <= 0){
        renderStoppedText(instanceId);
      }

      const rest = arr.slice(1,3);
      const chips = rest.map(a=>{
        const h = typeof a.realtimeArrival === 'number' ? fmtHHMM(a.realtimeArrival)
                : (typeof a.scheduledArrival === 'number' ? `≈${fmtHHMM(a.scheduledArrival)}` : '—');
        const eta = a.seconds < 60 ? `en ${a.seconds} s` : `en ${Math.ceil(a.seconds/60)} min`;
        const dl = delayInfo(a);
        return { hourText: h, bigText: eta || "—", delayLabel: dl.label, delayCls: dl.cls };
      });

      const nextBox = $("#next-"+instanceId);
      if (chips.length){
        nextBox.classList.add("show");
        nextBox.innerHTML = renderNextChipsHtml(chips);
      } else {
        nextBox.classList.remove("show");
        nextBox.innerHTML = "";
      }

      setStatus(instanceId, "OK");
      p.lastUpdated = started; setUpdated(instanceId, started);
    }catch(e){
      $("#info-"+instanceId).innerHTML = `<div class="next-time">—</div><div class="hint">⚠️ Error al actualizar</div>`;
      $("#next-"+instanceId).classList.remove("show");
      $("#next-"+instanceId).innerHTML = "";
      setAlerts(instanceId, []);
      setStatus(instanceId, "Error");
      console.warn('Arrivals error', e);
    }
  }

  function renderStopItem({id, nombre, selected, latitud, longitud, isFav, isRecent}){
    const div = document.createElement("div");
    div.className = "stop-item" + (selected ? " selected" : "");
    div.dataset.id = id;
    div.dataset.name = nombre;
    if (latitud) div.dataset.lat = latitud;
    if (longitud) div.dataset.lng = longitud;

    const tags = [];
    if (isFav) tags.push("★ favorita");
    if (isRecent) tags.push("reciente");

    div.innerHTML = `
      <div class="row-main">
        <div class="row-title">${escapeHtml(nombre)}</div>
        <div class="row-sub">${tags.length ? escapeHtml(tags.join(" · ")) : ""}</div>
      </div>
      <div class="row-right"><i class="material-icons" style="font-size:18px;color:var(--muted)">chevron_right</i></div>
    `;
    return div;
  }

  function closeStops(){
    const modal = $("#stopsModal");
    modal.classList.remove('open');
    detachViewportShim(modal);
    unlockBodyScroll();
    const instanceId = currentStopsForInstance;
    if (instanceId) $("#stop-picker-"+instanceId)?.setAttribute('aria-expanded','false');
  }

  function selectStop(stopId, name){
    const instanceId = currentStopsForInstance; if(!instanceId || !panels[instanceId]) return;
    const p = panels[instanceId];

    p.currentStopId = stopId;
    p.currentStopName = name;

    $("#stop-name-"+instanceId).textContent = name;

    pushRecent(p.line.code, {id: stopId, name});
    closeStops();
    refreshPanel(instanceId);
    updateFavIcon(instanceId);
    persistAllPanels();

  async function showStopsList(instanceId){
    currentStopsForInstance = instanceId;
    const panel = panels[instanceId]; if(!panel) return;

    $("#stop-picker-"+instanceId)?.setAttribute('aria-expanded','true');

    $("#stopsModalTitle").textContent = `Paradas • ${panel.line.code} — ${panel.line.name}`;
    $("#stopsListContainer").innerHTML = `<div style="padding:12px;color:var(--muted)">Cargando…</div>`;
    $("#stopSearchInput").value = "";
    $("#stopsModal").classList.add('open');
    lockBodyScroll();
    attachViewportShim($("#stopsModal"));
    setTimeout(()=>{ $("#stopSearchInput")?.focus({preventScroll:true}); }, 50);

    try{
      const data = await getJSON(panel.line.stopsUrl);
      if (!data || !Array.isArray(data.recorrido)) throw new Error('Respuesta sin recorrido');

      const fav = getFavorite(instanceId);
      const recents = getRecents(panel.line.code);

      const cont = $("#stopsListContainer");
      cont.innerHTML = "";

      if (fav && fav.id) {
        cont.insertAdjacentHTML("beforeend", `<div class="section-title">⭐ Favorita</div>`);
        cont.appendChild(renderStopItem({ id: fav.id, nombre: fav.name, selected: fav.id === panel.currentStopId, isFav: true }));
        cont.insertAdjacentHTML("beforeend", `<div class="divider"></div>`);
      }

      if (recents.length) {
        cont.insertAdjacentHTML("beforeend", `<div class="section-title">🕘 Recientes</div>`);
        recents.forEach(r=>{
          cont.appendChild(renderStopItem({ id: r.id, nombre: r.name, selected: r.id === panel.currentStopId, isRecent: true }));
        });
        cont.insertAdjacentHTML("beforeend", `<div class="divider"></div>`);
      }

      cont.insertAdjacentHTML("beforeend", `<div class="section-title">Todas las paradas</div>`);

      data.recorrido.forEach(st=>{
        cont.appendChild(renderStopItem({
          id: st.idParada,
          nombre: st.nombre,
          selected: st.idParada === panel.currentStopId,
          latitud: st.latitud,
          longitud: st.longitud,
          isFav: fav && fav.id === st.idParada
        }));
      });

      cont.onclick = (e)=>{
        const it = e.target.closest('.stop-item');
        if(!it) return;
        selectStop(it.dataset.id, it.dataset.name);
      };
    }catch(err){
      $("#stopsListContainer").innerHTML = `<div style="padding:12px;color:var(--muted)">⚠️ No se pudieron cargar las paradas.</div>`;
      console.warn('Stops modal error', err);
    }
  }

  let timelineForInstance = null;

  function closeTimeline(){
    const modal = $("#timelineModal");
    modal.classList.remove("open");
    detachViewportShim(modal);

  function renderTimelineItems({instanceId, items, destination}){
    const panel = panels[instanceId];
    const accent = getComputedStyle($("#panel-"+instanceId)).getPropertyValue("--line-accent").trim() || "var(--primary)";
    $("#timelineModal").style.setProperty("--line-accent", accent);

    const host = $("#timelineBody");

      host.innerHTML = `<div class="tl-empty">No hay datos de llegada para las siguientes paradas.</div>`;
      return;
    }

    host.innerHTML = items.map(it=>{
      const cls = it.isCurrent ? "tl-item current" : "tl-item";
      const timeCls = it.timeText === "—" ? "tl-time muted" : (it.isCurrent ? "tl-time soon" : "tl-time");
      const rel = it.minutes != null ? (it.minutes === 0 ? "ahora" : `en ${it.minutes} min`) : "";
      return `
        <div class="${cls}">
          <div class="tl-rail"><div class="tl-dot"></div></div>
          <div class="tl-main">
            <div class="tl-stop" title="${escapeHtml(it.stopName)}">${escapeHtml(it.stopName)}</div>
            <div class="tl-meta">
              ${it.isCurrent ? `<span class="pill" style="padding:3px 10px">Parada actual</span>` : ``}
              ${rel ? `<span>${escapeHtml(rel)}</span>` : ``}
            </div>
          </div>
          <div class="${timeCls}">${escapeHtml(it.timeText)}</div>
        </div>
      `;

  async function fetchArrivalForStop({ stopId, line, routeCode, tripId }){
    const url = ARRIVALS_TPL.replace("{stopId}", stopId).replace("{lineCode}", routeCode);
    const data = await getJSON(url);

    let arr = (data.llegadas || []);

    // Filtra por línea
    if (line.type === "tram") {
      arr = arr.filter(x => x.line === line.code);
    } else {
      arr = arr.filter(x => x.line === routeCode);
    }

    // ✅ Clave: seguir el mismo vehículo/viaje
    if (!tripId) return null;
    arr = arr.filter(x => String(x.trip ?? "") === String(tripId));

    arr.sort((a, b) => (a.seconds ?? 1e12) - (b.seconds ?? 1e12));
    return arr[0] || null;
  }

  async function openTimeline(instanceId, {destination=null} = {}){
    const panel = panels[instanceId];
    if (!panel?.currentStopId) return;

    // Asegura tener el recorrido cacheado
    if (!Array.isArray(panel.stops) || !panel.stops.length){
      try{
        const data = await getJSON(panel.line.stopsUrl);
        if (data?.recorrido) panel.stops = data.recorrido;
      }catch(_){}
    }

    const stops = Array.isArray(panel.stops) ? panel.stops : [];
    const idx = stops.findIndex(s => String(s.idParada) === String(panel.currentStopId));
    const current = idx >= 0 ? stops[idx] : { idParada: panel.currentStopId, nombre: panel.currentStopName || "Parada actual" };

    const routeCode = getRouteCode(panel.line);

    // UI modal (abrimos ya, con loading)
    $("#timelineModalTitle").textContent = `Siguientes paradas • ${panel.line.code}`;
    const sub = [];
    sub.push(`<span class="pill">Parada: <strong>${escapeHtml(panel.currentStopName || "—")}</strong></span>`);
    if (destination) sub.push(`<span class="pill">Destino: <strong>${escapeHtml(destination)}</strong></span>`);
    $("#timelineModalSub").innerHTML = sub.join("");

    $("#timelineBody").innerHTML = `<div class="tl-empty">Cargando…</div>`;
    $("#timelineModal").classList.add("open");
    lockBodyScroll();
    attachViewportShim($("#timelineModal"));

    // Selecciona el "vehículo objetivo" en la parada actual (el más próximo),
    // y si se especifica destination (tranvía), lo respetamos.
    let anchorArrival = null;

    const pickAnchorFromArr = (arr)=>{
      if (!Array.isArray(arr) || !arr.length) return null;
      let a = arr;
      if (destination) a = a.filter(x => String(x.destination ?? "") === String(destination));
      a = a.slice().sort((x,y)=>(x.seconds ?? 1e12)-(y.seconds ?? 1e12));
      return a[0] || null;
    };

    anchorArrival = pickAnchorFromArr(panel.lastArrivals);

    if (!anchorArrival){
      try{
        const url0 = ARRIVALS_TPL.replace("{stopId}", panel.currentStopId).replace("{lineCode}", routeCode);
        const data0 = await getJSON(url0);

        let arr0 = (data0.llegadas || []);
        if (panel.line.type === "tram") arr0 = arr0.filter(x => x.line === panel.line.code);
        else arr0 = arr0.filter(x => x.line === routeCode);

        anchorArrival = pickAnchorFromArr(arr0);
      }catch(_){ anchorArrival = null; }
    }

    const tripId = anchorArrival?.trip != null ? String(anchorArrival.trip) : null;

    if (!tripId){
      $("#timelineBody").innerHTML = `<div class="tl-empty">No hay suficiente información en tiempo real para seguir <strong>este mismo vehículo</strong> en las siguientes paradas.</div>`;
      return;
    }

    // Paradas a mostrar: actual + siguientes (limitadas)
    const nextStops = (idx >= 0 ? stops.slice(idx, idx + 11) : [current]).map(s=>({ id: s.idParada, name: s.nombre }));

    const items = [];
    for (let i=0;i<nextStops.length;i++){
      const st = nextStops[i];
      let top = null;

      if (i === 0){
        top = anchorArrival;
      } else {
        try{
          top = await fetchArrivalForStop({ stopId: st.id, line: panel.line, routeCode, tripId });
        }catch(_){ top = null; }
      }

      const timeText = top
        ? (typeof top.realtimeArrival === "number" ? fmtHHMM(top.realtimeArrival) :
           (typeof top.scheduledArrival === "number" ? `≈${fmtHHMM(top.scheduledArrival)}` : "—"))
        : "—";

      const mins = (top && typeof top.seconds === "number")
        ? Math.max(0, Math.ceil(top.seconds / 60))
        : null;

      items.push({
        stopId: st.id,
        stopName: st.name || "—",
        timeText,
        minutes: mins,
        isCurrent: i === 0
      });
    }

    renderTimelineItems({ instanceId, items, destination: destination || (anchorArrival?.destination || null) });
  }

  /* ========= Add modal ========= */
  function openAddModal(){
    $("#addModal").classList.add("open");
    lockBodyScroll();
    attachViewportShim($("#addModal"));
    $("#addSearchInput").value = "";
    renderAddList();
    setTimeout(()=>$("#addSearchInput")?.focus({preventScroll:true}), 50);
  }
  function closeAddModal(){
    $("#addModal").classList.remove("open");
    detachViewportShim($("#addModal"));
    unlockBodyScroll();
  }
  function setAddFilter(type){
    addFilter = type;
    $("#chipAll").classList.toggle("active", type==="all");
    $("#chipBus").classList.toggle("active", type==="bus");
    $("#chipTram").classList.toggle("active", type==="tram");
    renderAddList();
  }

  function renderAddList(){
    const q = ($("#addSearchInput").value || "").trim().toLowerCase();

    const filtered = lines
      .filter(l => addFilter==="all" ? true : l.type===addFilter)
      .filter(l => !q || l.code.toLowerCase().includes(q) || l.name.toLowerCase().includes(q))
      .sort((a,b)=>{
        if (a.type !== b.type) return a.type.localeCompare(b.type);
        return a.code.localeCompare(b.code);
      });

    const host = $("#addList");
    if (!filtered.length){
      host.innerHTML = `<div style="padding:12px;color:var(--muted)">No hay resultados.</div>`;
      return;
    }

    host.innerHTML = filtered.map(l=>{
      const ico = l.type==="bus" ? "directions_bus" : "tram";
      const accent =
        l.type==="tram" ? "var(--accent-tram)" :
        (colorCache[l.code] ? colorCache[l.code] : "var(--accent-bus)");

      return `
        <div class="add-item" role="option" tabindex="0" data-code="${escapeHtml(l.code)}" style="--chip-accent:${accent}">
          <span class="line-pill" style="--line-accent:var(--chip-accent)">
            <i class="material-icons" aria-hidden="true">${ico}</i>${escapeHtml(l.code)}
          </span>
          <div class="row-main">
            <div class="row-title">${escapeHtml(l.name)}</div>
            <div class="row-sub">${l.type==="bus" ? "Autobús" : "Tranvía"}</div>
          </div>
          <div class="row-right">Añadir</div>
        </div>
      `;
    }).join("");

    filtered.forEach(l => ensureLineColor(l));

    host.onclick = (e)=>{
      const it = e.target.closest(".add-item");
      if (!it) return;
      const code = it.dataset.code;
      const line = lines.find(x=>x.code===code);
      if (line){
        createPanel(line, {focus:true, pinOnAdd:true});
        closeAddModal();
      }
    };
    host.onkeydown = (e)=>{
      if (e.key==="Enter"){
        const it = e.target.closest(".add-item");
        if (!it) return;
        const code = it.dataset.code;
        const line = lines.find(x=>x.code===code);
        if (line){
          createPanel(line, {focus:true, pinOnAdd:true});
          closeAddModal();
        }
      }
    };
  }

  /* ========= Persist ========= */
  function persistAllPanels(){
    const ids = Object.keys(panels);
    const snapshot = ids.map(id=>{
      const p = panels[id];
      return {
        id,
        lineCode: p.line.code,
        pinned: isPinned(id),
        stop: p.currentStopId ? { id: p.currentStopId, name: p.currentStopName } : null,
        favorite: getFavorite(id)
      };
    });
    saveJSON("panel_instances", snapshot);
  }

  function loadInitialPanels(){
    const snapshot = loadJSON("panel_instances", []);
    if (!snapshot.length){
      updateEmpty();
      return;
    }
    snapshot.forEach(item=>{
      const line = lines.find(l=>l.code===item.lineCode);
      if (!line) return;
      const id = createPanel(line, {focus:false, pinOnAdd:item.pinned});
      if (item.stop?.id){
        panels[id].currentStopId = item.stop.id;
        panels[id].currentStopName = item.stop.name || null;
        $("#stop-name-"+id).textContent = panels[id].currentStopName || "Parada";
      }
      if (item.favorite?.id){
        setFavorite(id, item.favorite);
        updateFavIcon(id);
      }
      refreshPanel(id);
    });
    persistAllPanels();
    renderPanelsOrder();
    updateEmpty();
  }

  /* ========= Theme ========= */
  function pref(){ return localStorage.getItem('theme_pref')||'auto'; }
  function sysDark(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function applyTheme(p){
    document.documentElement.classList.add('theme-switching');
    const t=p==='auto'?(sysDark()?'dark':'light'):p;
    document.documentElement.setAttribute('data-theme',t);
    $("#themeIcon").textContent=t==='dark'?'light_mode':'dark_mode';
    const c=t==='dark'?'#0b1220':'#f6f8fc';
    $("#metaThemeLight").setAttribute('content',c);
    $("#metaThemeDark").setAttribute('content',c);
    setTimeout(()=>document.documentElement.classList.remove('theme-switching'),250);
  }
  function cycleTheme(){
    const c=pref();
    const n=c==='auto'?'light':c==='light'?'dark':'auto';
    localStorage.setItem('theme_pref',n);
    applyTheme(n);
  }

  function refreshAll(){
    globalLastRefresh = Date.now();
    updateGlobalUpdated();
    Object.keys(panels).forEach(id => refreshPanel(id));
  }

  /* ========= Init ========= */
  document.addEventListener('DOMContentLoaded', ()=>{
    $("#navAdd").addEventListener("click", openAddModal);
    $("#navRefresh").addEventListener('click', ()=>{
      const ic=$("#navRefresh i");
      ic.classList.add('spin');
      refreshAll();
      setTimeout(()=>ic.classList.remove('spin'), 900);
    });

    $("#themeToggle").addEventListener('click', cycleTheme);

    $("#closeAdd").addEventListener("click", closeAddModal);
    $("#addModal").addEventListener("click", (e)=>{ if (e.target===e.currentTarget) closeAddModal(); });
    $("#addSearchInput").addEventListener("input", renderAddList);
    $("#chipAll").addEventListener("click", ()=> setAddFilter("all"));
    $("#chipBus").addEventListener("click", ()=> setAddFilter("bus"));
    $("#chipTram").addEventListener("click", ()=> setAddFilter("tram"));

    $("#closeStops").addEventListener('click', closeStops);

    $("#closeTimeline").addEventListener('click', closeTimeline);
    $("#timelineModal").addEventListener('click', e=>{ if(e.target===e.currentTarget) closeTimeline(); });

    $("#stopsModal").addEventListener('click', e=>{ if(e.target===e.currentTarget) closeStops(); });

    document.addEventListener('keydown', e=>{
      if(e.key==='Escape'){
        closeAddModal();
        closeStops();
        closeTimeline();
      }
    });

    $("#stopSearchInput").addEventListener('input', function(){
      const q=this.value.toLowerCase();
      $$("#stopsListContainer .stop-item").forEach(it=>{
        const name = (it.dataset.name || it.textContent || "").toLowerCase();
        it.style.display = name.includes(q) ? "" : "none";
      });
    });

    $("#nearbyStopsBtn").addEventListener('click', ()=>{
      if (!navigator.geolocation) return alert("La geolocalización no está disponible.");
      navigator.geolocation.getCurrentPosition(pos=>{
        const {latitude,longitude}=pos.coords;
        const items=$$("#stopsListContainer .stop-item");
        const hav=(lat1,lon1,lat2,lon2)=>{
          const R=6371000, toRad=d=>d*Math.PI/180;
          const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
          const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
          return 2*R*Math.asin(Math.sqrt(a));
        };
        const arr=items.map(el=>{
          const lat=parseFloat(el.dataset.lat), lng=parseFloat(el.dataset.lng);
          const d=(Number.isFinite(lat)&&Number.isFinite(lng))?hav(latitude,longitude,lat,lng):Number.POSITIVE_INFINITY;
          return {el,d};
        }).sort((a,b)=>a.d-b.d);

        const cont=$("#stopsListContainer");
        const fixed = Array.from(cont.children).filter(ch=>!ch.classList.contains("stop-item"));
        cont.innerHTML = "";
        fixed.forEach(x=>cont.appendChild(x));
        arr.forEach(x=>cont.appendChild(x.el));
      }, _=>alert("No se pudo obtener tu ubicación."));
    });

    window.addEventListener('online', ()=> $("#offlineBanner").style.display = 'none');
    window.addEventListener('offline', ()=> $("#offlineBanner").style.display = 'block');
    $("#offlineBanner").style.display = navigator.onLine ? 'none' : 'block';

    applyTheme(pref());
    if (window.matchMedia){
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
        if(pref()==='auto') applyTheme('auto');
      });
    }

    loadInitialPanels();
    refreshAll();

    if (globalTickTimer) clearInterval(globalTickTimer);
    globalTickTimer = setInterval(updateGlobalUpdated, 1000);

    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(refreshAll, 35 * 1000);
  });
  </script>
</body>
